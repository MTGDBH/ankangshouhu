<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>长寿康 Family Pro · 家人协同守护中心</title>
<link href="assets/css/pro-tailwind.css" rel="stylesheet"/>
<link href="assets/css/fontawesome.min.css" rel="stylesheet"/>
<link href="assets/css/pro-charts.css" rel="stylesheet"/>
<style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: #F2F2F7;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
    }
    
    .glass-surface {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.75);
    }
    
    .glass-sidebar {
      background: rgba(248, 248, 250, 0.85);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-right: 1px solid rgba(215, 215, 222, 0.65);
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(226, 226, 232, 0.7);
    }

    /* Custom thin scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.14);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    .tab-active {
      background: #18181B !important;
      color: #FFFFFF !important;
    }

    .view-fade {
      animation: fadeInView 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInView {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col antialiased select-none">
<!-- Main Application Wrapper -->
<div class="flex-1 flex overflow-hidden">
<!-- Left Navigation & Multi-Elderly Sidebar -->
<aside class="w-72 lg:w-80 h-full glass-sidebar flex flex-col shrink-0 z-20">
<!-- Brand & Status Pill -->
<div class="p-5 pb-4 flex items-center justify-between border-b border-zinc-200/50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-2xl bg-zinc-900 text-white flex items-center justify-center shadow-md">
<i class="fa-solid fa-heart-pulse text-lg"></i>
</div>
<div>
<div class="font-bold text-sm text-zinc-900 tracking-tight flex items-center gap-1.5">
              长寿康 Family Pro
              <span class="text-[10px] bg-zinc-200/80 text-zinc-700 px-1.5 py-0.5 rounded-full font-medium">子女端</span>
</div>
<p class="text-xs text-zinc-400 mt-0.5">跨设备亲情健康管理</p>
</div>
</div>
</div>
<!-- Multiple Elderly Selection Section -->
<div class="p-4 border-b border-zinc-200/40">
<div class="flex items-center justify-between mb-2.5 px-1">
<span class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">看护的长辈 (<span id="elderlyCount">3</span>)</span>
<button class="text-xs font-semibold text-zinc-800 hover:text-black flex items-center gap-1 transition-colors" onclick="openModal('addElderlyModal')">
<i class="fa-solid fa-plus text-[10px]"></i> 绑定新长辈
          </button>
</div>
<!-- Elderly Selector List -->
<div class="space-y-1.5" id="elderlyListContainer">
<!-- Populated by JS -->
</div>
</div>
<!-- Navigation Menu -->
<nav class="flex-1 overflow-y-auto p-4 space-y-1">
<div class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider px-3 py-1.5">功能视图</div>
<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all tab-active" id="nav-overview" onclick="switchView('overview')">
<i class="fa-solid fa-chart-pie w-4 text-center"></i>
          今日全貌与体征
        </button>
<!-- Dedicated AI Care Agent Tab -->
<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/50 hover:text-zinc-900 transition-all" id="nav-ai-agent" onclick="switchView('ai-agent')">
<div class="relative">
<i class="fa-solid fa-wand-magic-sparkles w-4 text-center text-emerald-600"></i>
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 absolute -top-0.5 -right-0.5"></span>
</div>
          AI 智能守护顾问
          <span class="ml-auto text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded-full font-bold">授权</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/50 hover:text-zinc-900 transition-all" id="nav-medication" onclick="switchView('medication')">
<i class="fa-solid fa-pills w-4 text-center"></i>
          改善计划与执行
          <span class="ml-auto text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-full font-bold" id="medBadge">计划</span>
</button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/50 hover:text-zinc-900 transition-all" id="nav-trends" onclick="switchView('trends')">
<i class="fa-solid fa-wave-square w-4 text-center"></i>
          健康数据图表
        </button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/50 hover:text-zinc-900 transition-all" id="nav-safety" onclick="switchView('safety')">
<i class="fa-solid fa-shield-heart w-4 text-center"></i>
          提醒与复测
        </button>
<button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/50 hover:text-zinc-900 transition-all" id="nav-records" onclick="switchView('records')">
<i class="fa-regular fa-folder-open w-4 text-center"></i>
          健康记录
        </button>
</nav>
<!-- Current User Profile Footer -->
<div class="p-4 border-t border-zinc-200/50 bg-white/40 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-zinc-800 text-white font-bold text-xs flex items-center justify-center">
            敏
          </div>
<div>
<div class="text-xs font-bold text-zinc-900">当前用户</div>
<div class="text-[11px] text-zinc-400">家属账号</div>
</div>
</div>
<button class="w-8 h-8 rounded-lg hover:bg-zinc-200/60 flex items-center justify-center text-zinc-500 text-xs" onclick="openModal('familySyncModal')" style="display:none" title="亲友权限配置">
<i class="fa-solid fa-user-group"></i>
</button>
</div>
</aside>
<!-- Right Main Workspace -->
<div class="flex-1 flex flex-col h-full overflow-hidden bg-apple-canvas">
<!-- Top Action Bar -->
<header class="h-16 glass-header px-8 flex items-center justify-between shrink-0 z-10">
<!-- Selected Elderly Profile Banner -->
<div class="flex items-center gap-4">
<div class="flex items-center gap-3">
<h1 class="text-xl font-bold tracking-tight text-zinc-900" id="currentElderlyTitle">正在加载…</h1>
<span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200/60 flex items-center gap-1.5" id="currentStatusBadge">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              指标平稳
            </span>
</div>
<span class="text-zinc-300">|</span>
<div class="text-xs text-zinc-400 flex items-center gap-2">
<span>最后同步：<strong class="text-zinc-600 font-medium" id="lastSyncTime">刚刚</strong></span>
<span class="inline-block w-1 h-1 rounded-full bg-zinc-300"></span>
<span class="flex items-center gap-1 text-zinc-600" id="deviceBatteryStatus">
近 30 天记录待加载
            </span>
</div>
</div>
<!-- Global Action Buttons -->
<div class="flex items-center gap-3">
<button id="familyVoiceActionBtn" type="button" class="h-9 px-3.5 rounded-xl glass-surface hover:bg-white text-xs font-semibold text-zinc-700 flex items-center gap-2 shadow-apple-sm transition-all active:scale-95" onclick="handleFamilyVoiceButtonClick()" title="本机朗读本页重点或停止" aria-pressed="false">
<i class="fa-solid fa-volume-high text-zinc-500" aria-hidden="true"></i><span id="familyVoiceLabel">朗读重点</span>
</button>
<button class="h-9 px-3.5 rounded-xl glass-surface hover:bg-white text-xs font-semibold text-zinc-700 flex items-center gap-2 shadow-apple-sm transition-all active:scale-95" onclick="refreshElderlyData()">
<i class="fa-solid fa-arrows-rotate text-zinc-400" id="refreshIcon"></i>
            刷新同步
          </button>
<button class="h-9 px-3.5 rounded-xl bg-zinc-900 hover:bg-black text-white text-xs font-semibold flex items-center gap-2 shadow-sm transition-all active:scale-95" onclick="openRemoteCallModal()">
<i class="fa-solid fa-phone text-xs"></i>
            发送关怀提醒
          </button>
<button class="w-9 h-9 rounded-xl glass-surface hover:bg-white text-zinc-700 flex items-center justify-center shadow-apple-sm transition-all" onclick="openModal('remoteSettingsModal')" style="display:none" title="长辈端远程配置">
<i class="fa-solid fa-sliders text-xs"></i>
</button>
</div>
</header>
<!-- Scrollable Main Content -->
<main class="flex-1 overflow-y-auto p-8 space-y-6" id="dashboardMain">
<!-- View 1: Overview & Vitals -->
<div class="view-panel view-fade space-y-6" id="view-overview"></div>
<!-- ==================== View: AI 智能守护顾问 ==================== -->
<div class="view-panel view-fade hidden space-y-6" id="view-ai-agent"></div>
<!-- View 2: Medication & Refill Center -->
<div class="view-panel view-fade hidden space-y-6" id="view-medication"></div>
<!-- View 3: Trends & Analytics -->
<div class="view-panel view-fade hidden space-y-6" id="view-trends"></div>
<!-- View 4: Safety & Device Management -->
<div class="view-panel view-fade hidden space-y-6" id="view-safety"></div>
<!-- View 5: Medical Records & Hospital Reviews -->
<div class="view-panel view-fade hidden space-y-6" id="view-records"></div>
</main>
</div>
</div>
<!-- ==================== Modals Layer ==================== -->
<!-- Modal 1: 绑定新长辈 Modal -->
<!-- Modal 2: 帮长辈新增服药计划 Modal -->
<!-- Modal 3: 协同备忘记录 Modal -->
<!-- Modal 4: 远程配置长辈端手机 Modal -->
<!-- Modal 5: 上传体检单 Modal -->
<!-- Modal 6: 家庭权限协同 Modal -->
<!-- Toast Notification -->
<div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-surface bg-zinc-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-apple-modal opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2" id="toast">
<i class="fa-solid fa-circle-check text-emerald-400"></i>
<span id="toastMsg">已同步最新数据</span>
</div>
<script src="assets/js/pro-core.js"></script>
<script src="assets/js/pro-charts.js"></script>
<script src="assets/js/pro-voice-summary.js"></script>
<script src="assets/js/pro-family.js"></script>
</body>
</html>

    Auth.init().then(() => main());

    async function main() {
      try {
        const cfg = await API.get('/api/settings/llm');
        renderConfig(cfg);
        await loadOpsMetrics();
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
        bindEvents();
      } catch (err) {
        document.getElementById('loading').innerHTML = '加载失败：' + err.message;
      }
    }

    async function loadOpsMetrics() {
      try {
        const data = await API.get('/api/ops/metrics');
        const m = data.llm || {}, d = m.last_24h || {};
        document.getElementById('ops-monitor').hidden = false;
        const percent = value => `${(Number(value || 0) * 100).toFixed(1)}%`;
        document.getElementById('ops-grid').innerHTML = [
          ['调用次数', d.calls || 0, `当前运行 ${m.active_runs || 0}`], ['P95 耗时', m.p95_latency_ms == null ? '—' : `${m.p95_latency_ms} ms`, `成功率 ${percent(d.success_rate)}`],
          ['失败 / 降级', `${d.failure_count || 0} / ${d.fallback_count || 0}`, `失败率 ${percent(d.failure_rate)} · 降级率 ${percent(d.fallback_rate)}`],
          ['Token / 估算成本', `${Number(d.total_tokens || 0).toLocaleString('zh-CN')}`, d.cost_estimate_available ? `约 ¥${Number(d.estimated_cost_cny || 0).toFixed(4)}` : '单价尚未配置'],
        ].map(row => `<article class="ops-metric"><span>${row[0]}</span><strong>${row[1]}</strong><small>${row[2]}</small></article>`).join('');
        document.getElementById('ops-note').textContent = m.cost_note || '';
      } catch (error) {
        if (error.status !== 403) console.warn('模型监控暂不可用', error);
      }
    }

    function renderConfig(cfg) {
      document.getElementById('base_url').value = cfg.base_url || '';
      document.getElementById('model').value = cfg.model || '';

      const badge = document.getElementById('mode-badge');
      if (cfg.mode === 'llm') {
        badge.textContent = 'LLM 模式';
        badge.classList.add('mode-llm');
      } else {
        badge.textContent = 'Mock 模式';
        badge.classList.add('mode-mock');
      }

      const keyHint = document.getElementById('key-hint');
      if (cfg.api_key_set) {
        keyHint.textContent = '已配置：' + cfg.api_key_masked;
        keyHint.style.color = 'var(--color-green-dark)';
      } else {
        keyHint.textContent = '未配置 API Key（当前为 Mock 模式）';
        keyHint.style.color = 'var(--color-coral-dark)';
      }
      const testButton = document.getElementById('btn-test');
      testButton.hidden = !cfg.can_test;
      if (!cfg.can_test) document.getElementById('test-result').textContent = '仅系统管理员可以发起外部模型连通性测试。';
    }

    function bindEvents() {
      document.getElementById('form-llm').addEventListener('submit', e => e.preventDefault());
      document.getElementById('btn-refresh-ops')?.addEventListener('click', loadOpsMetrics);

      // 测试连接
      document.getElementById('btn-test').addEventListener('click', async () => {
        const result = document.getElementById('test-result');
        const btn = document.getElementById('btn-test');
        btn.disabled = true;
        btn.textContent = '测试中…';
        result.hidden = false;
        result.className = 'settings-test-result testing';
        result.textContent = '正在连接…';

        try {
          const r = await API.post('/api/settings/llm/test');
          result.className = 'settings-test-result ' + (r.success ? 'success' : 'fail');
          result.textContent = r.message;
        } catch (err) {
          result.className = 'settings-test-result fail';
          result.textContent = '测试失败：' + err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = '测试连接';
        }
      });

      // 退出登录
      document.getElementById('btn-logout').addEventListener('click', async () => {
        if (!confirm('确定要退出登录吗？')) return;
        try { await API.post('/api/auth/logout'); } catch {}
        location.href = 'login.html';
      });
    }
  </script>
</template>

<script>
    document.addEventListener('auth:ready', () => {
      const params = new URLSearchParams(window.location.search);
      const score = params.get('score');
      const sources = params.get('sources');
      const reasoning = params.get('reasoning');

      if (score) {
        // 有参数 → 显示当前消息的可信度详情
        const s = parseInt(score, 10);
        document.getElementById('msg-detail').hidden = false;

        const scoreEl = document.getElementById('detail-score');
        const barEl = document.getElementById('detail-bar');
        scoreEl.textContent = s;
        barEl.style.width = s + '%';

        // 颜色
        if (s >= 80) {
          scoreEl.style.color = '#5A8045';
          barEl.style.background = 'linear-gradient(90deg, #7FB069, #5A8045)';
          document.getElementById('detail-mode').style.background = '#E5F0DC';
          document.getElementById('detail-mode').style.color = '#5A8045';
          document.getElementById('detail-mode').textContent = '高可信度';
        } else if (s >= 60) {
          scoreEl.style.color = '#C4823A';
          barEl.style.background = 'linear-gradient(90deg, #F4A261, #C4823A)';
          document.getElementById('detail-mode').style.background = '#FFF4E6';
          document.getElementById('detail-mode').style.color = '#C4823A';
          document.getElementById('detail-mode').textContent = '中可信度';
        } else {
          scoreEl.style.color = '#A04632';
          barEl.style.background = 'linear-gradient(90deg, #E0784E, #A04632)';
          document.getElementById('detail-mode').style.background = '#FBE4DD';
          document.getElementById('detail-mode').style.color = '#A04632';
          document.getElementById('detail-mode').textContent = '低可信度';
        }

        // 数据来源
        if (sources) {
          try {
            const arr = JSON.parse(sources);
            if (arr.length) {
              document.getElementById('detail-sources-wrap').hidden = false;
              const colors = ['#F4A261', '#7FB069', '#9C7BC9', '#E0784E', '#9C8B7A'];
              document.getElementById('detail-sources').innerHTML = arr.map((s, i) => `
                <li>
                  <span class="source-dot" style="background:${colors[i % colors.length]}"></span>
                  <span>${escapeHTML(s)}</span>
                </li>
              `).join('');
            }
          } catch {}
        }

        // 评分依据
        if (reasoning) {
          document.getElementById('detail-reasoning-wrap').hidden = false;
          document.getElementById('detail-reasoning').textContent = reasoning;
        }
      } else {
        // 无参数 → 显示常识说明
        document.getElementById('sense-section').hidden = false;
      }
    });
    Auth.init();

    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    }
  </script>
</template>

        </div>
        <div class="dev-card-desc">个人信息、头像、设置、退出登录</div>
        <span class="dev-card-file">profile.html</span>
      </a>
    </div>

    <!-- 底部信息 -->
    <div class="dev-footer">
      <strong>页面导航结构</strong><br />
      登录/注册 → 概览（首页）→ 健康监测 → 指标趋势（子页）<br />
      概览 → 健康评估 / 智能管家 / 健康知识 / 预警中心 / 个人中心<br />
      <br />
      <strong>API 地址</strong>：<code id="api-base">检测中…</code><br />
      <strong>鉴权方式</strong>：Cookie（credentials: include），401 自动跳转 <code>login.html?next=</code><br />
      <strong>后端入口</strong>：<code>server/</code> 目录，RAG 知识库在 <code>elderly-health-rag/</code>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    // 显示 API 地址
    document.getElementById('api-base').textContent = API.BASE || '(同源)';

    // 全部打开
    function openAll() {
      const pages = ['login.html','register.html','index.html','monitoring.html',
        'assessment.html','agent.html','knowledge.html','metric.html?type=bp',
        'alerts.html','profile.html'];
      pages.forEach(p => window.open(p, '_blank'));
    }

    // 检查 API 连接
    async function checkAPI() {
      const dot = document.getElementById('api-dot');
      const text = document.getElementById('api-text');
      dot.className = 'api-dot';
      text.textContent = '检测中…';
      try {
        const res = await fetch(API.BASE + '/api/health/summary', {
          credentials: 'include',
          signal: AbortSignal.timeout(3000)
        });
        if (res.status === 401) {
          dot.className = 'api-dot online';
          text.textContent = 'API 在线（需登录）';
        } else if (res.ok) {
          dot.className = 'api-dot online';
          text.textContent = 'API 在线（已登录）';
        } else {
          dot.className = 'api-dot offline';
          text.textContent = 'API 异常 (' + res.status + ')';
        }
      } catch (err) {
        dot.className = 'api-dot offline';
        text.textContent = 'API 离线';
      }
    }

    // 页面加载时自动检测一次
    checkAPI();
  </script>
  <script src="/assets/js/desktop-ui.js"></script>
</template>
<!-- end-views -->
</body>

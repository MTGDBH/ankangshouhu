    /* 高清晰高对比辅助模式 */
    body.high-contrast-mode {

    }
    body.high-contrast-mode .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #27272a;
    }
    body.high-contrast-mode .text-zinc-500,
    body.high-contrast-mode .text-zinc-400 {

    }

    /* 页面平滑过渡 */
    .view-fade {
      animation: viewFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 语音波动光效 */
    @keyframes subtlePulse {
      0%, 100% { opacity: 1; transform: scale(1); }

<script src="/assets/js/weather.js"></script>
  <script>
    document.addEventListener('auth:ready', (e) => {
      const u = e.detail;
      document.querySelector('[data-bind="greeting"]').textContent = greeting(u.name);
      loadDesktopDashboard(u);
      loadSummary();
      loadTodos();
      loadAlerts();
      WeatherWidget.init();
    });
    Auth.init();

    function greeting(name) {
      const h = new Date().getHours();
      const time = h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
      return `${name || '您'}，${time}`;
    }

    async function loadDesktopDashboard(user) {
      document.getElementById('desktop-user-name').textContent = user.name || '您好';
      document.getElementById('desktop-date').textContent = `${new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' })} · 今天也要照顾好自己`;
      try {
        const [summary, metrics, todos] = await Promise.all([
          API.get('/api/health/summary'), API.get('/api/health/metrics'), API.get('/api/todos/today')
        ]);
        document.getElementById('desktop-score').textContent = summary.total_score ?? '--';
        document.getElementById('desktop-score-status').textContent = summary.total_score >= 80 ? '整体状态良好' : summary.total_score >= 60 ? '有几项需要关注' : '建议及时评估';
        document.getElementById('desktop-score-trend').textContent = summary.trend || '保持稳定';
        const show = (id, metric, formatter) => {
          const item = metrics[metric];
          document.getElementById(id).textContent = item ? formatter(item) : '--';
        };
        show('desktop-bp', 'bp', v => `${Math.round(v.value)}/${Math.round(v.value2)}`);
        show('desktop-hr', 'hr', v => Math.round(v.value));
        show('desktop-glucose', 'glucose', v => Number(v.value).toFixed(1));
        show('desktop-weight', 'weight', v => Number(v.value).toFixed(1));
        const pending = (todos || []).filter(item => !item.completed);
        document.getElementById('desktop-task-count').textContent = `${pending.length} 项待完成`;
        document.getElementById('desktop-task-list').innerHTML = pending.length ? pending.slice(0, 3).map((item, index) => `<a href="intervention.html"><i>${index + 1}</i><div><strong>${escapeHTML(item.title || item.content || '健康任务')}</strong><small>${escapeHTML(item.time || item.scheduled_time || '今天完成')}</small></div><span>去完成 ›</span></a>`).join('') : '<p class="desktop-empty">今天的任务已全部完成，做得很好。</p>';
      } catch {}
      try {
        const alertData = await API.get('/api/alerts?status=pending');
        const first = alertData.items?.[0];
        if (first) {
          document.getElementById('desktop-alert-title').textContent = first.title || '有一项指标需要关注';
          document.getElementById('desktop-alert-desc').textContent = first.description || first.message || '查看详情并按建议处理';
        }
      } catch {}
    }

    async function loadSummary() {
      const d = await API.get('/api/health/summary');
      document.querySelector('[data-bind="today"]').textContent =
        `${d.today} · ${weekdayCN(d.today)}`;
      document.querySelector('[data-bind="today-short"]').textContent = d.today;
      document.querySelector('[data-bind="total_score"]').textContent = d.total_score;
      const status = d.total_score >= 80 ? '状态良好' : d.total_score >= 60 ? '需关注' : '需复诊';
      document.querySelector('[data-bind="status"]').textContent = status;
      const trend = d.subscores;
      f('sleep', trend.sleep);
      f('nutrition', trend.nutrition);
      f('mood', trend.mood);
      f('activity', trend.activity);

      try {
        const list = await API.get('/api/assessments');
        if (list.length > 1) {
          const last = list[0];
          const dt = (last.created_at || '').slice(0, 10);
          document.querySelector('[data-bind="last-assess"]').textContent = `上次评估：${dt}`;
          if (last.total_score) {
            const diff = d.total_score - last.total_score;
            const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '·';
            document.querySelector('[data-bind="trend"]').textContent = `${arrow} ${Math.abs(diff)}`;
          }
        } else {
          document.querySelector('[data-bind="trend"]').textContent = '· 基线';
          document.querySelector('[data-bind="last-assess"]').textContent = '尚无历史评估';
        }
      } catch {
        document.querySelector('[data-bind="trend"]').textContent = '· —';
      }
    }

    function f(key, value) {
      const num = document.querySelector(`[data-bind="${key}"]`);
      if (num) num.textContent = value ?? '--';
      const order = value >= 80 ? '持平良好' : value >= 60 ? '需留意' : '偏低';
      const tr = document.querySelector(`[data-bind="${key}-trend"]`);
      if (tr) tr.textContent = order;
    }

    async function loadTodos() {
      const todos = await API.get('/api/todos/today');
      const done = todos.filter(t => t.completed).length;
      document.querySelector('[data-bind="todo-count"]').textContent = `${todos.length} 项 · 已完成 ${done}`;
      const host = document.getElementById('todo-list');
      if (!todos.length) {
        host.innerHTML = '<div class="empty">今天没有待办，享受轻松的一天</div>';
        return;
      }
      host.innerHTML = todos.map(t => `
        <button class="todo-item ${t.completed ? 'done' : ''}" data-id="${t.id}" data-completed="${t.completed ? '1' : '0'}">
          <div class="quick-mark" style="background:${iconColor(t.kind)};color:#fff;width:36px;height:36px;border-radius:18px;font-size:15px;display:flex;align-items:center;justify-content:center">${iconChar(t.kind)}</div>
          <div class="text">
            <div class="name">${escapeHTML(t.title)}</div>
            <div class="meta">${t.time}${t.completed ? ' · 已完成' : ' · 待完成'}</div>
          </div>
        </button>
      `).join('');
      host.querySelectorAll('button.todo-item').forEach(b => {
        b.addEventListener('click', async () => {
          const id = parseInt(b.dataset.id, 10);
          const completed = b.dataset.completed !== '1';
          try {
            await API.patch(`/api/todos/${id}`, { completed });
            loadTodos();
          } catch (err) {
            toast(err.message, 'error');
          }
        });
      });
    }

    async function loadAlerts() {
      try {
        const s = await API.get('/api/alerts/summary');
        document.querySelector('[data-bind="alert-sub"]').textContent = `${s.pending} 条待处理`;
        if (s.pending === 0) return;
        const { items } = await API.get('/api/alerts?status=pending');
        if (items.length) {
          const a = items[0];
          document.getElementById('alert-box').hidden = false;
          document.querySelector('[data-bind="alert-title"]').textContent = a.title;
          document.querySelector('[data-bind="alert-desc"]').textContent = a.message;
        }
      } catch {}
    }

    function iconColor(kind) {
      return { medication: '#F4A261', exercise: '#7FB069', todo: '#F4A261', meal: '#9C7BC9', sleep: '#9C7BC9' }[kind] || '#F4A261';
    }
    function iconChar(kind) {
      return { medication: '药', exercise: '走', todo: '测', meal: '食', sleep: '眠' }[kind] || '·';
    }
    function weekdayCN(dateStr) {
      return ['周日','周一','周二','周三','周四','周五','周六'][new Date(dateStr).getDay()];
    }
    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  </script>
</template>

    <section class="entry-section">

    <section class="monitor-bottom">

      <div class="pred-card pred-card-clickable" onclick="location.href='prediction.html'">

          <span class="pred-badge" id="pred-badge">—</span>

            <button type="button" class="custom-metric-color-btn" data-color="#3E8E8E" style="background:#3E8E8E"></button>

  <!-- shared-scripts -->
<script src="/assets/js/health-bulk-entry.js"></script>
  <script>
    document.addEventListener('auth:ready', () => {
      loadAll();
      loadDesktopRecordBoard();
    });
    Auth.init();

    async function loadDesktopRecordBoard() {
      const type = new URLSearchParams(location.search).get('type') || 'bp';
      document.querySelectorAll('[data-metric-tab]').forEach(tab => tab.classList.toggle('is-active', tab.dataset.metricTab === type));
      try {
        const [types, data] = await Promise.all([API.get('/api/trend/types'), API.get(`/api/trend/${encodeURIComponent(type)}?days=7`)]);
        const meta = (types || []).find(item => item.type === type) || { name: type === 'bp' ? '血压' : type, unit: '' };
        const points = data.points || [];
        const latest = data.latest || points.at(-1);
        const stats = data.stats || {};
        document.getElementById('desktop-trend-title').textContent = `${meta.name}趋势`;
        document.getElementById('record-latest').textContent = latest ? (type === 'bp' ? `${Math.round(latest.value)}/${Math.round(latest.value2)}` : formatDesktopMetric(latest.value, type)) : '--';
        document.getElementById('record-average').textContent = stats.avg != null ? (type === 'bp' && stats.avg2 != null ? `${Math.round(stats.avg)}/${Math.round(stats.avg2)}` : formatDesktopMetric(stats.avg, type)) : '--';
        document.getElementById('record-high').textContent = stats.max != null ? formatDesktopMetric(stats.max, type) : '--';
        document.getElementById('record-status').textContent = data.comment ? '已更新' : '数据不足';
        document.querySelector('.desktop-stat-strip article:nth-child(1) span').textContent = meta.unit || '';
        document.querySelector('.desktop-stat-strip article:nth-child(2) span').textContent = meta.unit || '';
        document.querySelector('.desktop-stat-strip article:nth-child(3) span').textContent = meta.unit || '';
        const legend = document.getElementById('desktop-chart-legend');
        legend.innerHTML = type === 'bp' ? '<span><i class="sbp"></i>收缩压</span><span><i class="dbp"></i>舒张压</span>' : `<span><i class="sbp"></i>${meta.name}</span>`;
        const head = document.getElementById('desktop-record-head');
        head.innerHTML = type === 'bp' ? '<th>日期时间</th><th>收缩压</th><th>舒张压</th><th>状态</th><th>来源</th>' : `<th>日期时间</th><th>${meta.name}</th><th>状态</th><th>来源</th>`;
        const svg = document.getElementById('desktop-bp-chart');
        svg.setAttribute('aria-label', `最近七天${meta.name}趋势`);
        if (!points.length) { svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#a3a7b1" font-size="13">暂无记录，先添加一条数据吧</text>'; document.getElementById('desktop-record-rows').innerHTML = `<tr><td colspan="${type === 'bp' ? 5 : 4}">暂无${meta.name}记录</td></tr>`; return; }
        const width = 900, height = 220, left = 48, right = 20, top = 20, bottom = 38;
        const series = type === 'bp' ? ['value','value2'] : ['value'];
        const values = points.flatMap(item => series.map(key => Number(item[key])));
        const min = Math.floor((Math.min(...values) - 5) / 5) * 5, max = Math.ceil((Math.max(...values) + 5) / 5) * 5;
        const x = index => left + index * ((width - left - right) / Math.max(1, points.length - 1));
        const y = value => top + (max - value) * ((height - top - bottom) / Math.max(1, max - min));
        const path = key => points.map((item, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)},${y(Number(item[key])).toFixed(1)}`).join(' ');
        const grid = [0,1,2,3,4].map(i => { const gy = top + i * (height-top-bottom)/4; const label = Math.round(max - i*(max-min)/4); return `<line x1="${left}" y1="${gy}" x2="${width-right}" y2="${gy}"/><text x="8" y="${gy+4}">${label}</text>`; }).join('');
        const labels = points.map((item,index) => `<text class="x-label" x="${x(index)}" y="${height-10}" text-anchor="middle">${new Date(item.recorded_at).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}</text>`).join('');
        const dots = key => points.map((item,index) => `<circle cx="${x(index)}" cy="${y(Number(item[key]))}" r="4"/>`).join('');
        svg.innerHTML = `<g class="chart-grid">${grid}</g>${labels}${series.map((key,index) => `<path class="${index ? 'chart-dbp' : 'chart-sbp'}" d="${path(key)}"/><g class="${index ? 'chart-dbp-dots' : 'chart-sbp-dots'}">${dots(key)}</g>`).join('')}`;
        const summaryText = `图表文字摘要：最近七天${meta.name}趋势，共${points.length}条记录；请结合图中数值和状态提示阅读。`;
        svg.dataset.summary = summaryText;
        const summary = svg.nextElementSibling?.classList.contains('a11y-chart-summary') ? svg.nextElementSibling : null;
        if (summary) summary.textContent = summaryText;
        setTimeout(() => { const later = svg.nextElementSibling?.classList.contains('a11y-chart-summary') ? svg.nextElementSibling : null; if (later) later.textContent = summaryText; }, 120);
        document.getElementById('desktop-record-rows').innerHTML = points.slice().reverse().slice(0,4).map(item => { const status = type === 'bp' ? (Number(item.value) >= 140 || Number(item.value2) >= 90 ? '偏高' : '正常') : '已记录'; return type === 'bp' ? `<tr><td>${new Date(item.recorded_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td><strong>${Math.round(item.value)}</strong> mmHg</td><td><strong>${Math.round(item.value2)}</strong> mmHg</td><td><span class="table-status ${status === '正常' ? 'ok' : ''}">${status}</span></td><td>手动记录</td></tr>` : `<tr><td>${new Date(item.recorded_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td><strong>${formatDesktopMetric(item.value, type)}</strong> ${meta.unit || ''}</td><td><span class="table-status ok">已记录</span></td><td>手动记录</td></tr>`; }).join('');
      } catch (error) { console.warn('桌面趋势加载失败', error); }
    }
    function formatDesktopMetric(value, type) { const n = Number(value); return ['glucose','sleep','weight','bodyfat','cholesterol','hba1c'].includes(type) ? n.toFixed(1) : Math.round(n); }

    // 内置指标定义：从 /api/health/metric-defs 拉取（后端 metric_defs 表为单一数据源）
    let METRIC_DEFS = [];
    let latestMetrics = {};

    // 格式化逻辑（渲染层，非指标定义；defs 未覆盖的 type 走通用格式）
    const FMT = {
      bp:      v => v ? `${v.value}/${v.value2}` : '--',
      glucose: v => v ? v.value.toFixed(1) : '--',
      hr:      v => v ? Math.round(v.value) : '--',
      sleep:   v => v ? v.value.toFixed(1) + 'h' : '--',
      spo2:    v => v ? Math.round(v.value) : '--',
      weight:  v => v ? v.value.toFixed(1) : '--',
      steps:   v => v ? Math.round(v.value).toLocaleString() : '--',
      temp:    v => v ? v.value.toFixed(1) : '--',
      resp:    v => v ? Math.round(v.value) : '--',
      grip:    v => v ? v.value.toFixed(1) : '--',
      bodyfat: v => v ? v.value.toFixed(1) : '--',
      waist:   v => v ? v.value.toFixed(0) : '--',
      uricacid: v => v ? Math.round(v.value) : '--',
      cholesterol: v => v ? v.value.toFixed(1) : '--',
      hba1c:   v => v ? v.value.toFixed(1) : '--',
    };
    const defaultFmt = v => v ? (v.value2 != null ? `${v.value}/${v.value2}` : String(v.value)) : '--';

    async function loadMetricDefs() {
      try {
        const defs = await API.get('/api/health/metric-defs');
        METRIC_DEFS = defs.map(d => ({
          type: d.type,
          name: d.name,
          unit: d.unit,
          color: d.color,
          bg: d.color + '22',
          icon: d.icon,
          fmt: FMT[d.type] || defaultFmt,
        }));
      } catch {
        // 定义加载失败时页面保持空卡片可交互，不白屏
        METRIC_DEFS = [];
      }
    }

    // 自定义指标（从后端加载后追加）
    let customDefs = [];

    async function loadCustomMetrics() {
      try {
        const all = await API.get('/api/prediction/metrics');
        customDefs = all.filter(m => m.custom).map(m => ({
          type: m.key,
          name: m.name,
          unit: m.unit,
          color: m.color,
          bg: m.color + '22',
          icon: m.icon,
          fmt: v => v ? v.value : '--',
          custom: true,
        }));
      } catch {}
    }

    async function loadAll() {
      await Promise.all([loadMetricDefs(), loadCustomMetrics()]);
      const [metrics, devices] = await Promise.all([
        API.get('/api/health/metrics'),
        API.get('/api/devices'),
      ]);
      latestMetrics = metrics;
      renderMetrics(metrics);
      renderDevices(devices);
      renderPred(metrics);
    }

    function renderMetrics(metrics) {
      const allDefs = [...METRIC_DEFS, ...customDefs];
      const recorded = allDefs.filter(d => metrics[d.type]).length;
      const draftCount = allDefs.filter(d => window.HealthBulkEntry?.getDraft?.(d.type)).length;
      document.getElementById('entry-tip').textContent = `已记录 ${recorded}/${allDefs.length}${draftCount ? ` · 待确认 ${draftCount}项` : ''}`;
      const grid = document.getElementById('metric-grid');
      const cards = allDefs.map(d => {
        const m = metrics[d.type];
        const draft = window.HealthBulkEntry?.getDraft?.(d.type);
        const shown = draft ? { value: draft.value, value2: draft.value2 } : m;
        const mainText = d.fmt(shown);
        const unitText = draft ? '识别填充 · 点击可修改' : (m ? `${d.unit} · ${fmtTime(m.recorded_at)}` : '点击录入');
        return `
          <button class="entry-card ${draft ? 'entry-card-draft' : ''}" data-type="${d.type}" style="text-align:left;cursor:pointer">
            ${draft ? '<span class="entry-draft-badge">待确认</span>' : ''}
            <div class="entry-icon" style="background:${d.bg};color:${d.color}">${d.icon}</div>
            <div class="entry-lbl">${d.name}</div>
            <div class="entry-val">${mainText}</div>
            <div class="entry-unit" style="color:${draft ? '#874018' : (m ? '#5A8045' : '#9C8B7A')}">${unitText}</div>
          </button>
        `;
      }).join('');
      grid.innerHTML = cards + `
        <button class="entry-card entry-card-add" id="btn-add-metric" style="text-align:center;cursor:pointer">
          <div class="entry-icon">+</div>
          <div class="entry-lbl">添加采集项</div>
          <div class="entry-unit">自定义指标</div>
        </button>
      `;
      grid.querySelectorAll('button.entry-card[data-type]').forEach(btn => {
        btn.addEventListener('click', () => openRecord(btn.dataset.type));
      });
      document.getElementById('btn-add-metric')?.addEventListener('click', openCustomMetricModal);
    }

    window.refreshTodayCards = () => renderMetrics(latestMetrics);

    function renderDevices(devices) {
      const list = document.getElementById('device-list');
      if (!devices.length) {
        list.innerHTML = '<div class="empty">还没有设备</div>';
        return;
      }
      list.innerHTML = devices.map(d => `
        <div class="device-row">
          <div class="device-icon">${(d.name || '·').slice(0, 1)}</div>
          <div class="device-text">
            <div class="device-name">${escapeHTML(d.name)}</div>
            <div class="device-status" style="color:${d.status === 'connected' ? '#5A8045' : '#9C8B7A'}">
              ${d.status === 'connected' ? '已连接' : '未连接'}${d.last_sync ? ' · ' + fromNow(d.last_sync) : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function renderPred(metrics) {
      try {
        const bpHistory = await API.get('/api/health/metrics/bp/history?days=7');
        const points = bpHistory.points;
        document.getElementById('pred-desc').textContent =
          `基于血压、血氧、睡眠和活动等 ${METRIC_DEFS.length + customDefs.length} 项数据综合评估；近 7 天共 ${points.length} 条血压记录。点击查看完整预测 →`;
        document.getElementById('pred-suggest').textContent = '建议：维持规律作息，每日散步 30 分钟';
        const sbpValues = points.map(p => p.value);
        const avg = sbpValues.length ? Math.round(sbpValues.reduce((a,b)=>a+b,0) / sbpValues.length) : 0;
        let badge = '正常', badgeColor = '#7FB069';
        if (avg >= 140) { badge = '需关注'; badgeColor = '#E0784E'; }
        else if (avg >= 130) { badge = '偏高'; badgeColor = '#F4A261'; }
        document.getElementById('pred-badge').textContent = `● ${badge}`;
        document.getElementById('pred-badge').setAttribute('aria-label', `综合趋势状态：${badge}`);
        document.getElementById('pred-badge').style.background = badgeColor + '22';
        document.getElementById('pred-badge').style.color = badgeColor;

        // 绘制折线图
        const svg = document.getElementById('pred-svg');
        if (points.length === 0) {
          svg.dataset.summary = '近7天血压趋势：暂无血压记录，无法判断上升、下降或稳定。';
          svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#9C8B7A" font-size="13" font-family="sans-serif">暂无血压记录</text>';
          return;
        }
        const W = 540, H = 80, padX = 12, padY = 14;
        const xs = points.map((_, i) => i);
        const ys = points.map(p => p.value);
        const yMin = Math.min(...ys) - 5;
        const yMax = Math.max(...ys) + 5;
        const xToPx = (i) => padX + (xs.length === 1 ? (W - 2*padX)/2 : (i/(xs.length-1))*(W - 2*padX));
        const yToPx = (v) => H - padY - ((v - yMin) / (yMax - yMin)) * (H - 2*padY);
        const polyline = points.map((p, i) => `${xToPx(i)},${yToPx(p.value)}`).join(' ');
        const first = points[0];
        const latest = points.at(-1);
        const change = Number(latest.value) - Number(first.value);
        const direction = change > 0 ? '上升' : change < 0 ? '下降' : '持平';
        svg.dataset.summary = `近7天收缩压趋势：共${points.length}条记录，从${first.value}变为${latest.value}毫米汞柱，总体${direction}${Math.abs(change).toFixed(1)}；平均${avg}毫米汞柱，页面状态标记为${badge}。此摘要只描述已有记录，不替代医学判断。`;
        const dots = points.map((p, i) =>
          `<circle cx="${xToPx(i)}" cy="${yToPx(p.value)}" r="3.5" fill="#F4A261"/>`
        ).join('');
        svg.innerHTML = `
          <polyline points="${polyline}" fill="none" stroke="#F4A261" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${dots}
        `;
      } catch (err) {
        document.getElementById('pred-desc').textContent = '预测生成失败';
      }
    }

    // ===== 录入浮窗 =====
    function openRecord(type) {
      const def = getMetricDef(type) || METRIC_DEFS.find(d => d.type === type);
      if (!def) return;
      document.getElementById('record-title').textContent = `录入${def.name}`;
      document.getElementById('lbl-value').textContent = type === 'bp' ? '收缩压（高压）' : '数值';
      document.getElementById('rec-hint').textContent = def.unit ? `单位：${def.unit}` : '请输入数值';
      document.getElementById('rec-row2').hidden = type !== 'bp';
      const draft = window.HealthBulkEntry?.getDraft?.(type);
      document.getElementById('rec-value').value = draft?.value ?? '';
      document.getElementById('rec-value2').value = draft?.value2 ?? '';
      const modal = document.getElementById('record-modal');
      modal.classList.add('show');
      modal.dataset.type = type;
      setTimeout(() => document.getElementById('rec-value').focus(), 50);
    }
    function closeRecord() {
      document.getElementById('record-modal').classList.remove('show');
    }
    document.getElementById('record-modal').addEventListener('click', (e) => {
      if (e.target.id === 'record-modal' || e.target.dataset.close !== undefined) closeRecord();
    });
    document.getElementById('record-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('record-modal').dataset.type;
      const def = getMetricDef(type) || METRIC_DEFS.find(d => d.type === type);
      if (!def) return;
      const v1 = document.getElementById('rec-value').value.trim();
      const v2 = type === 'bp' ? document.getElementById('rec-value2').value.trim() : null;
      if (!v1) return;
      const value = parseFloat(v1);
      const value2 = v2 ? parseFloat(v2) : null;
      const draft = window.HealthBulkEntry?.getDraft?.(type);
      try {
        await API.post('/api/health/metrics', {
          type, value, value2, unit: def.unit || null, source: 'manual',
          note: draft ? '由健康数据描述核对后录入' : null,
          measurement_condition: draft?.measurement_condition,
          measurement_context: draft ? { entry_mode: 'text_review', parser_version: 'health_text_v1', user_confirmed: true } : undefined,
        });
        window.HealthBulkEntry?.removeDraft?.(type);
        toast('录入成功', 'success');
        closeRecord();
        loadAll();
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }

    // ===== 自定义采集项 =====
    let selectedIcon = '自';
    let selectedColor = '#F4A261';

    function openCustomMetricModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('show');
      document.getElementById('cm-name').value = '';
      document.getElementById('cm-unit').value = '';
      document.getElementById('cm-min').value = '';
      document.getElementById('cm-max').value = '';
      selectedIcon = '自';
      selectedColor = '#F4A261';
      setTimeout(() => document.getElementById('cm-name').focus(), 50);
    }

    document.getElementById('custom-modal').addEventListener('click', (e) => {
      if (e.target.id === 'custom-modal' || e.target.dataset.close !== undefined) {
        document.getElementById('custom-modal').classList.remove('show');
      }
    });

    document.getElementById('cm-icon-row').addEventListener('click', (e) => {
      const btn = e.target.closest('.custom-metric-icon-btn');
      if (!btn) return;
      document.querySelectorAll('#cm-icon-row .custom-metric-icon-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedIcon = btn.dataset.icon;
    });

    document.getElementById('cm-color-row').addEventListener('click', (e) => {
      const btn = e.target.closest('.custom-metric-color-btn');
      if (!btn) return;
      document.querySelectorAll('#cm-color-row .custom-metric-color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = btn.dataset.color;
    });

    document.getElementById('custom-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('cm-name').value.trim();
      const unit = document.getElementById('cm-unit').value.trim();
      const ref_min = document.getElementById('cm-min').value ? parseFloat(document.getElementById('cm-min').value) : null;
      const ref_max = document.getElementById('cm-max').value ? parseFloat(document.getElementById('cm-max').value) : null;
      if (!name) return;
      try {
        await API.post('/api/prediction/custom-metrics', {
          name, unit, icon: selectedIcon, color: selectedColor, ref_min, ref_max,
        });
        toast('添加成功', 'success');
        document.getElementById('custom-modal').classList.remove('show');
        loadAll();
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    // 录入自定义指标时更新提示
    function getMetricDef(type) {
      return [...METRIC_DEFS, ...customDefs].find(d => d.type === type);
    }
  </script>
</template>

  <!-- shared-scripts -->
<script>
    document.addEventListener('auth:ready', () => loadAll());
    Auth.init();

    async function loadAll() {
      try {
        const d = await API.get('/api/assessments/latest');
        renderTotal(d);
        renderSubs(d.subscores);
        renderScoreDetail(d);
        renderAdlIadl(d);
        renderSuggest(d.suggestions);
        document.getElementById('evaluated-at').textContent = '最近评估：' + (d.evaluated_at || '').slice(0, 16).replace('T', ' ');
      } catch (err) {
        document.getElementById('summary-text').textContent = '加载失败：' + err.message;
      }
    }

    const diseaseRiskMeta = [
      { key: 'hypertension', name: '高血压', icon: '压', tone: 'orange', desc: '关注血压变化' },
      { key: 'diabetes', name: '糖尿病', icon: '糖', tone: 'purple', desc: '关注血糖记录' },
      { key: 'heart_disease', name: '心脏病', icon: '心', tone: 'green', desc: '关注心血管状态' },
      { key: 'stroke', name: '脑卒中', icon: '脑', tone: 'red', desc: '关注综合风险因素' },
    ];

    async function loadDiseaseRisks() {
      const host = document.getElementById('disease-risk-grid');
      const results = await Promise.all(diseaseRiskMeta.map(async meta => {
        try { return { meta, data: await API.get('/api/prediction/disease/' + meta.key) }; }
        catch (error) { return { meta, data: { success: false, error: error.message || '暂时无法获取' } }; }
      }));
      host.innerHTML = results.map(({ meta, data }) => renderDiseaseRisk(meta, data)).join('');
    }

    function renderDiseaseRisk(meta, data) {
      if (!data || data.error === 'no_data') {
        return `<article class="disease-risk-card ${meta.tone}">
          <div class="risk-card-top"><span class="risk-icon">${meta.icon}</span><div><div class="risk-name">${meta.name}</div><div class="risk-desc">${meta.desc}</div></div><span class="risk-state muted">待记录</span></div>
          <div class="risk-empty">还没有足够的监测数据<br><a href="monitoring.html">去记录数据 →</a></div>
        </article>`;
      }
      if (!data.success) {
        return `<article class="disease-risk-card ${meta.tone}"><div class="risk-card-top"><span class="risk-icon">${meta.icon}</span><div><div class="risk-name">${meta.name}</div><div class="risk-desc">${meta.desc}</div></div><span class="risk-state muted">暂不可用</span></div><div class="risk-empty">${escapeHTML(data.error || '风险服务暂时不可用')}</div></article>`;
      }
      const pct = Math.max(0, Math.min(100, Number(data.risk_percent) || 0));
      const level = data.risk_level === 'higher' ? '需重点关注' : data.risk_level === 'moderate' ? '建议留意' : '相对较低';
      const stateClass = data.risk_level === 'higher' ? 'high' : data.risk_level === 'moderate' ? 'mid' : 'low';
      const confidence = data.confidence === 'low' ? '可信度较低' : data.confidence === 'medium' ? '可信度中等' : '可信度较高';
      const missing = Array.isArray(data.missing_features) ? data.missing_features.length : 0;
      const completeness = data.data_completeness || {};
      const nextSteps = Array.isArray(completeness.next_steps) ? completeness.next_steps.slice(0, 2) : [];
      const completenessText = missing
        ? `建议先补充：${nextSteps.map(escapeHTML).join('、') || '个人病史和生活方式资料'}`
        : '模型输入资料较完整，可结合复测继续观察';
      return `<article class="disease-risk-card ${meta.tone}">
        <div class="risk-card-top"><span class="risk-icon">${meta.icon}</span><div><div class="risk-name">${meta.name}</div><div class="risk-desc">${meta.desc}</div></div><span class="risk-state ${stateClass}">${level}</span></div>
        <div class="risk-number-row"><span class="risk-number">${pct.toFixed(2)}</span><span class="risk-unit">%</span><span class="risk-confidence">${confidence}</span></div>
        <div class="risk-bar"><span style="width:${Math.max(3, pct)}%"></span></div>
        <div class="risk-meta"><span>模型：${data.model === 'xgboost' ? 'XGBoost' : 'Logistic'}</span><span>${missing ? '缺少 ' + missing + ' 项数据' : '数据较完整'}</span></div>
        <div class="risk-desc" style="margin-top:8px;color:#9C8B7A">${completenessText}</div>
      </article>`;
    }

    function renderTotal(d) {
      const total = Number(d.total_score);
      const hasTotal = Number.isFinite(total);
      const coverage = Number(d.scoring_details?.coverage_percent) || 0;
      document.getElementById('ring-num').textContent = hasTotal ? Math.round(total) : '--';
      const dash = hasTotal ? Math.round((total / 100) * 628) : 0;
      document.getElementById('ring-progress').setAttribute('stroke-dasharray', `${dash} 628`);
      const lowCoverage = coverage < 40;
      const badge = lowCoverage ? '数据不足' : total >= 80 ? '状态良好' : total >= 60 ? '需关注' : '需复诊';
      const badgeBg = lowCoverage ? '#EEF1F0' : total >= 80 ? '#E5F0DC' : total >= 60 ? '#FFE9D9' : '#FBE4DD';
      const badgeColor = lowCoverage ? '#66736F' : total >= 80 ? '#5A8045' : total >= 60 ? '#F4A261' : '#A04632';
      const el = document.getElementById('total-badge');
      el.textContent = badge;
      el.style.background = badgeBg;
      el.style.color = badgeColor;
      document.getElementById('summary-text').textContent = d.summary;
      document.getElementById('ring-meta').textContent = `· 分层加权计算 · 数据覆盖 ${coverage}%`;
    }

    function renderSubs(s) {
      const order = [
        { key: 'sleep',     label: '睡眠',     bg: '#F1E8F5', color: '#9C7BC9' },
        { key: 'nutrition', label: '营养',     bg: '#FFE9D9', color: '#F4A261' },
        { key: 'mood',      label: '情绪',     bg: '#FBE4DD', color: '#E0784E' },
        { key: 'activity',  label: '活动',     bg: '#E5F0DC', color: '#7FB069' },
        { key: 'chronic',   label: '慢病控制', bg: '#F4D5C9', color: '#A04632' },
      ];
      const list = document.getElementById('sub-list');
      list.innerHTML = order.map(o => {
        const hasValue = Number.isFinite(Number(s[o.key]));
        const v = hasValue ? Math.round(Number(s[o.key])) : null;
        const w = hasValue ? Math.max(0, Math.min(100, v)) : 0;
        return `
          <div class="sub-row${hasValue ? '' : ' is-empty'}">
            <div class="sub-label">${o.label}</div>
            <div class="sub-bar" style="background:${o.bg}"><div class="sub-fill" style="width:${w}%;background:${o.color}"></div></div>
            <div class="sub-num">${hasValue ? v : '—'}</div>
          </div>
        `;
      }).join('');
    }

    function renderScoreDetail(d) {
      const details = d.scoring_details || {};
      const dimensions = Array.isArray(details.dimensions) ? details.dimensions : [];
      const available = dimensions.filter(item => Number.isFinite(Number(item.score)));
      const total = Number(d.total_score);
      const coverage = Number(details.coverage_percent) || 0;
      const availableWeight = Number(details.available_weight) || available.reduce((sum, item) => sum + Number(item.weight || 0), 0);
      document.getElementById('score-detail-preview').textContent = `数据覆盖 ${coverage}% · 点击查看算法`;
      document.getElementById('score-coverage').textContent = `${coverage}%`;
      const coverageNote = document.getElementById('score-coverage-note');
      coverageNote.className = `score-coverage-note ${coverage < 40 ? 'low' : coverage < 70 ? 'mid' : 'good'}`;
      coverageNote.textContent = coverage < 40
        ? '当前数据覆盖较低，分数只能作为有限参考；建议继续补充睡眠、活动、营养和慢病指标。'
        : coverage < 70 ? '当前已有部分关键数据，继续完善记录可提高评分稳定性。' : '当前数据覆盖较完整，评分更适合用于观察近期趋势。';

      document.getElementById('score-detail-formula').textContent = available.length
        ? `(${available.map(item => `${Math.round(item.score)}×${item.weight}%`).join(' + ')}) ÷ ${availableWeight}% = ${Number.isFinite(total) ? Math.round(total) : '—'} 分`
        : '总分暂不可计算，请先记录健康数据。';

      document.getElementById('score-detail-items').innerHTML = dimensions.map(item => {
        const hasScore = Number.isFinite(Number(item.score));
        const metrics = Array.isArray(item.metrics) ? item.metrics : [];
        const metricRows = metrics.length ? metrics.map(metric => {
          const value = metric.value2 == null ? metric.value : `${metric.value}/${metric.value2}`;
          return `<div class="score-metric-row"><span><b>${escapeHTML(metric.label)}</b><small>最新 ${escapeHTML(value)}${escapeHTML(metric.unit || '')}</small></span><span><small>维度内权重 ${metric.weight}%</small><strong>${metric.score} 分</strong></span></div>`;
        }).join('') : '<div class="score-metric-empty">近 7 天暂无可评分记录</div>';
        return `<article class="score-dimension-card${hasScore ? '' : ' is-empty'}">
          <header><span><b>${escapeHTML(item.label)}</b><small>总分权重 ${item.weight}%</small></span><strong>${hasScore ? `${Math.round(item.score)} 分` : '未参与'}</strong></header>
          <div class="score-metric-list">${metricRows}</div>
        </article>`;
      }).join('') || '<div class="score-metric-empty">暂无评分明细</div>';
    }

    const scoreDialog = document.getElementById('score-detail-dialog');
    document.getElementById('score-detail-open').addEventListener('click', () => scoreDialog.showModal());
    document.getElementById('score-detail-close').addEventListener('click', () => scoreDialog.close());
    scoreDialog.addEventListener('click', event => { if (event.target === scoreDialog) scoreDialog.close(); });

    function renderAdlIadl(d) {
      // 数值代表“有困难或需要帮助”的项目数，越少越好。
      const adl = Number.isFinite(Number(d.adl)) ? Number(d.adl) : null;
      const iadl = Number.isFinite(Number(d.iadl)) ? Number(d.iadl) : null;
      document.getElementById('adl').textContent = adl == null ? '--' : `${adl} 项`;
      document.getElementById('iadl').textContent = iadl == null ? '--' : `${iadl} 项`;
      document.getElementById('adl-status').textContent = adl == null ? '尚未评估' : adl === 0 ? '可独立完成' : '存在受限';
      document.getElementById('iadl-status').textContent = iadl == null ? '尚未评估' : iadl === 0 ? '可独立完成' : '存在受限';
      const dateText = d.functional_evaluated_at ? fmtDate(d.functional_evaluated_at) : '尚未完成';
      document.getElementById('life-sub').textContent = `受限项目数，越少越好 · ${dateText}`;
      document.getElementById('btn-assess').textContent = d.functional_complete ? '重新进行生活能力评估' : '开始生活能力评估';
    }

    function renderSuggest(list) {
      const host = document.getElementById('suggest-list');
      if (!list || !list.length) { host.innerHTML = '<div class="empty">当前没有建议</div>'; return; }
      const colors = ['#E8896E', '#F4A261', '#7FB069'];
      const chars = ['1', '2', '3'];
      host.innerHTML = list.slice(0, 3).map((s, i) => `
        <div class="imp-row" style="background:${i === 0 ? '#FBE4DD' : i === 1 ? '#FFE9D9' : '#E5F0DC'}">
          <div class="imp-icon" style="background:${colors[i]}">${chars[i]}</div>
          <div class="imp-text">
            <div class="imp-name" style="color:${i === 0 ? '#A04632' : i === 1 ? '#8C4520' : '#3D6630'}">${escapeHTML(s.title)}</div>
            <div class="imp-desc" style="color:${i === 0 ? '#8A4538' : i === 1 ? '#A45F3D' : '#5A8045'}">${escapeHTML(s.detail)}</div>
          </div>
        </div>
      `).join('');
    }

    const functionDialog = document.getElementById('function-assess-dialog');
    let functionSchema = null;
    let functionAnswers = {};
    let functionStep = 0;

    async function openFunctionAssessment() {
      const message = document.getElementById('function-form-message');
      message.textContent = '正在读取问卷…';
      try {
        const [schema, latest] = await Promise.all([
          API.get('/api/prediction/intake/schema'),
          API.get('/api/prediction/intake/latest').catch(() => ({ answers: {} })),
        ]);
        functionSchema = schema;
        functionAnswers = { ...(latest.answers || {}) };
        functionStep = 0;
        renderFunctionAssessment();
        functionDialog.showModal();
      } catch (err) {
        toast('问卷加载失败：' + err.message, 'error');
      }
    }

    function functionQuestionsForStep(step) {
      const prefix = step === 0 ? 'adl_' : 'iadl_';
      return (functionSchema?.questions || []).filter(question => question.id.startsWith(prefix));
    }

    function renderFunctionAssessment() {
      const isAdl = functionStep === 0;
      document.getElementById('function-step-adl').classList.toggle('is-active', isAdl);
      document.getElementById('function-step-adl').classList.toggle('is-complete', !isAdl);
      document.getElementById('function-step-iadl').classList.toggle('is-active', !isAdl);
      document.getElementById('function-back').style.visibility = isAdl ? 'hidden' : 'visible';
      document.getElementById('function-next').textContent = isAdl ? '下一步' : '完成评估';
      document.getElementById('function-progress').textContent = `第 ${functionStep + 1} 步，共 2 步`;
      document.getElementById('function-intro').innerHTML = isAdl
        ? '<strong>基本生活 ADL</strong><span>评估吃饭、穿衣和移动等基础生活是否需要帮助</span>'
        : '<strong>工具性生活 IADL</strong><span>评估购物、做饭和用药等复杂生活事务是否需要帮助</span>';
      document.getElementById('function-form-message').textContent = '';
      const questions = functionQuestionsForStep(functionStep);
      document.getElementById('function-question-list').innerHTML = questions.map((question, index) => `
        <fieldset class="function-question" data-question-id="${escapeHTML(question.id)}">
          <legend><span>${index + 1}</span>${escapeHTML(question.prompt)}</legend>
          <div class="function-options">${question.options.map(option => {
            const checked = String(functionAnswers[question.id]) === String(option.value) ? ' checked' : '';
            return `<label><input type="radio" name="${escapeHTML(question.id)}" value="${escapeHTML(option.value)}"${checked}><span>${escapeHTML(option.label)}</span></label>`;
          }).join('')}</div>
        </fieldset>`).join('');
    }

    function collectFunctionAnswers() {
      for (const question of functionQuestionsForStep(functionStep)) {
        const checked = document.querySelector(`input[name="${question.id}"]:checked`);
        if (checked) functionAnswers[question.id] = Number(checked.value);
      }
    }

    function validateFunctionStep() {
      collectFunctionAnswers();
      const missing = functionQuestionsForStep(functionStep).find(question => functionAnswers[question.id] == null);
      document.querySelectorAll('.function-question.is-missing').forEach(el => el.classList.remove('is-missing'));
      if (!missing) return true;
      const field = document.querySelector(`[data-question-id="${missing.id}"]`);
      field?.classList.add('is-missing');
      field?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('function-form-message').textContent = '请完成本页所有项目后继续。';
      return false;
    }

    document.getElementById('btn-assess').addEventListener('click', openFunctionAssessment);
    document.getElementById('function-assess-close').addEventListener('click', () => functionDialog.close());
    document.getElementById('function-back').addEventListener('click', () => { collectFunctionAnswers(); functionStep = 0; renderFunctionAssessment(); });
    document.getElementById('function-next').addEventListener('click', async () => {
      if (!validateFunctionStep()) return;
      if (functionStep === 0) { functionStep = 1; renderFunctionAssessment(); return; }
      const button = document.getElementById('function-next');
      button.disabled = true;
      button.textContent = '正在保存…';
      try {
        await API.post('/api/prediction/intakes', { answers: functionAnswers, status: 'completed' });
        functionDialog.close();
        toast('生活能力评估已完成', 'success');
        await loadAll();
      } catch (err) {
        document.getElementById('function-form-message').textContent = '保存失败：' + err.message;
      } finally {
        button.disabled = false;
        button.textContent = '完成评估';
      }
    });
    functionDialog.addEventListener('click', event => { if (event.target === functionDialog) functionDialog.close(); });

    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  </script>
</template>

<script>
    document.addEventListener('auth:ready', async () => {

      bindAgentWorkspaceHeight();

    const PROMPTS = ['看看我的总体健康', '看看最近血压', '生成今日健康方案', '我想问一个健康问题'];
    const AGENT_SPLIT_KEY = 'xiaokang-agent-split-ratio-v2';
    const AGENT_WORKSPACE_HEIGHT_KEY = 'xiaokang-agent-workspace-height-v3';

    function bindAgentSplitter() {
      const row = document.querySelector('.agent-row');
      const splitter = document.getElementById('agent-splitter');
      if (!row || !splitter || splitter.dataset.bound === '1') return;
      splitter.dataset.bound = '1';
      let dragging = false;
      let ratio = Number(localStorage.getItem(AGENT_SPLIT_KEY));
      if (!Number.isFinite(ratio)) ratio = 0.64;

      const clampRatio = value => Math.max(0.54, Math.min(0.74, Number(value) || 0.64));
      const isStacked = () => window.matchMedia('(max-width: 1260px)').matches;
      function applyRatio(next, persist = false) {
        ratio = clampRatio(next);
        if (isStacked()) {
          row.style.removeProperty('--agent-chat-width');
        } else {
          const available = Math.max(0, row.getBoundingClientRect().width - splitter.offsetWidth);
          const minRatio = Math.max(0.54, Math.min(0.62, 620 / Math.max(1, available)));
          const maxRatio = Math.min(0.74, Math.max(0.64, 1 - 390 / Math.max(1, available)));
          ratio = Math.max(minRatio, Math.min(maxRatio, ratio));
          row.style.setProperty('--agent-chat-width', `${Math.round(available * ratio)}px`);
          splitter.setAttribute('aria-valuemin', String(Math.round(minRatio * 100)));
          splitter.setAttribute('aria-valuemax', String(Math.round(maxRatio * 100)));
        }
        splitter.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
        splitter.setAttribute('aria-valuetext', `聊天区约占${Math.round(ratio * 100)}%`);
        document.querySelectorAll('[data-agent-layout-ratio]').forEach(button => button.classList.toggle('active', Math.abs(Number(button.dataset.agentLayoutRatio) - ratio) < 0.025));
        if (persist) localStorage.setItem(AGENT_SPLIT_KEY, ratio.toFixed(4));
      }
      function ratioFromPointer(event) {
        const rect = row.getBoundingClientRect();
        const available = Math.max(1, rect.width - splitter.offsetWidth);
        return (event.clientX - rect.left) / available;
      }
      splitter.addEventListener('pointerdown', event => {
        if (isStacked()) return;
        dragging = true;
        splitter.setPointerCapture(event.pointerId);
        document.body.classList.add('agent-is-resizing');
        event.preventDefault();
      });
      splitter.addEventListener('pointermove', event => {
        if (!dragging) return;
        applyRatio(ratioFromPointer(event));
      });
      const finishDrag = event => {
        if (!dragging) return;
        dragging = false;
        if (splitter.hasPointerCapture?.(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
        document.body.classList.remove('agent-is-resizing');
        applyRatio(ratio, true);
      };
      splitter.addEventListener('pointerup', finishDrag);
      splitter.addEventListener('pointercancel', finishDrag);
      splitter.addEventListener('dblclick', () => applyRatio(0.64, true));
      splitter.addEventListener('keydown', event => {
        if (isStacked()) return;
        if (!['ArrowLeft', 'ArrowRight', 'Home'].includes(event.key)) return;
        applyRatio(event.key === 'Home' ? 0.64 : ratio + (event.key === 'ArrowLeft' ? -0.02 : 0.02), true);
        event.preventDefault();
      });
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => applyRatio(ratio), 80);
      });
      document.querySelectorAll('[data-agent-layout-ratio]').forEach(button => button.addEventListener('click', () => applyRatio(Number(button.dataset.agentLayoutRatio), true)));
      document.getElementById('agent-layout-reset')?.addEventListener('click', () => {
        localStorage.removeItem(AGENT_SPLIT_KEY);
        applyRatio(0.64);
      });
      applyRatio(ratio);
    }

    function bindAgentWorkspaceHeight() {
      const row = document.querySelector('.agent-row');
      const handle = document.getElementById('agent-workspace-height-resizer');
      if (!row || !handle || handle.dataset.bound === '1') return;
      handle.dataset.bound = '1';
      const isStacked = () => window.matchMedia('(max-width: 1260px)').matches;
      const defaultHeight = () => Math.max(620, Math.min(900, Math.round(window.innerHeight - 300)));
      const clamp = value => Math.max(560, Math.min(1100, Math.round(Number(value) || defaultHeight())));
      let height = clamp(Number(localStorage.getItem(AGENT_WORKSPACE_HEIGHT_KEY)) || defaultHeight());
      let dragging = false;
      let startY = 0;
      let startHeight = height;

      function applyHeight(next, persist = false) {
        height = clamp(next);
        if (isStacked()) row.style.removeProperty('--agent-workspace-height');
        else row.style.setProperty('--agent-workspace-height', `${height}px`);
        handle.setAttribute('aria-valuenow', String(height));
        handle.setAttribute('aria-valuetext', `工作区高度约${height}像素`);
        if (persist) localStorage.setItem(AGENT_WORKSPACE_HEIGHT_KEY, String(height));
      }
      handle.addEventListener('pointerdown', event => {
        if (isStacked()) return;
        dragging = true;
        startY = event.clientY;
        startHeight = row.getBoundingClientRect().height;
        handle.setPointerCapture(event.pointerId);
        document.body.classList.add('agent-is-resizing-height');
        event.preventDefault();
      });
      handle.addEventListener('pointermove', event => {
        if (dragging) applyHeight(startHeight + event.clientY - startY);
      });
      const finish = event => {
        if (!dragging) return;
        dragging = false;
        if (handle.hasPointerCapture?.(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        document.body.classList.remove('agent-is-resizing-height');
        applyHeight(height, true);
      };
      handle.addEventListener('pointerup', finish);
      handle.addEventListener('pointercancel', finish);
      handle.addEventListener('dblclick', () => {
        localStorage.removeItem(AGENT_WORKSPACE_HEIGHT_KEY);
        applyHeight(defaultHeight());
      });
      handle.addEventListener('keydown', event => {
        if (isStacked() || !['ArrowUp', 'ArrowDown', 'Home'].includes(event.key)) return;
        applyHeight(event.key === 'Home' ? defaultHeight() : height + (event.key === 'ArrowUp' ? -30 : 30), true);
        event.preventDefault();
      });
      document.getElementById('agent-layout-reset')?.addEventListener('click', () => {
        localStorage.removeItem(AGENT_WORKSPACE_HEIGHT_KEY);
        applyHeight(defaultHeight());
      });

      document.getElementById('agent-height-increase')?.addEventListener('click', () => applyHeight(height + 80, true));

    let lastUserMessage = '';
    let ttsUtterance = null;
    let me = null;
    let subjectId = null;
    let conversationId = null;
    let activeChatController = null;
    let activeClientRequestId = null;
    let chatProgressTimer = null;

    const agentQuery = () => `subject_user_id=${encodeURIComponent(subjectId)}${conversationId ? `&conversation_id=${encodeURIComponent(conversationId)}` : ''}`;

    function bindAgentContext() {
      document.getElementById('agent-subject').addEventListener('change', async e => {
        subjectId = Number(e.target.value); conversationId = null;

    function bindAgentPlanDrawer() {
      const drawer = document.getElementById('agent-plan-drawer');
      const toggle = document.getElementById('agent-plan-toggle');
      const close = document.getElementById('agent-plan-close');
      const setOpen = open => {
        drawer.classList.toggle('is-open', open);
        drawer.setAttribute('aria-hidden', String(!open));
        toggle.setAttribute('aria-expanded', String(open));
      };
      toggle.addEventListener('click', () => setOpen(!drawer.classList.contains('is-open')));
      close.addEventListener('click', () => setOpen(false));
      document.addEventListener('keydown', event => { if (event.key === 'Escape') setOpen(false); });

    function syncConversationList() {
      document.querySelectorAll('#agent-conversation-list [data-conversation-id]').forEach(item => {
        const active = Number(item.dataset.conversationId) === Number(conversationId);
        item.classList.toggle('is-active', active);
        item.setAttribute('aria-selected', String(active));
      });
    }

    async function initAgentContext() {
      me = await API.get('/api/auth/me'); subjectId = me.id;
      syncInterventionLink();
      let relationships = { as_member: [] };
      try { relationships = await API.get('/api/care/relationships'); } catch {}

        const wrap = document.getElementById('agent-subject-wrap'); wrap.hidden = false;
        document.getElementById('agent-subject').innerHTML = `<option value="${me.id}">${escapeHTML(me.name)}（本人）</option>` + relationships.as_member.filter(x => x.status === 'active').map(x => `<option value="${x.senior_id}">${escapeHTML(x.name)}（已授权）</option>`).join('');

    function syncInterventionLink() {
      const link = document.getElementById('agent-intervention-link');
      if (link && subjectId) link.href = `intervention.html?subject_user_id=${encodeURIComponent(subjectId)}`;
    }

    async function loadConversations() {
      let data = await API.get(`/api/chat/conversations?subject_user_id=${subjectId}`);
      if (!data.items?.some(x => x.status === 'active')) {
        const created = await API.post('/api/chat/conversations', { subject_user_id: subjectId, title: '健康对话' });
        data.items = [created, ...(data.items || [])];
      }
      if (!conversationId || !data.items.some(x => Number(x.id) === Number(conversationId) && x.status === 'active')) conversationId = data.items.find(x => x.status === 'active').id;
      document.getElementById('agent-conversation').innerHTML = data.items.map(x => `<option value="${x.id}" ${Number(x.id)===Number(conversationId)?'selected':''} ${x.status==='archived'?'disabled':''}>${escapeHTML(x.title)}${x.status==='archived'?'（已归档）':''}</option>`).join('');
      const conversations = data.items || [];
      document.getElementById('agent-history-count').textContent = `${conversations.filter(x => x.status === 'active').length} 条`;
      document.getElementById('agent-conversation-list').innerHTML = conversations.length ? conversations.map(x => `
        <button type="button" role="option" data-conversation-id="${x.id}" ${x.status === 'archived' ? 'disabled' : ''} aria-selected="${Number(x.id) === Number(conversationId)}" class="${Number(x.id) === Number(conversationId) ? 'is-active' : ''}">
          <span aria-hidden="true">${x.status === 'archived' ? '□' : '○'}</span><strong>${escapeHTML(x.title || '健康对话')}</strong>${x.status === 'archived' ? '<small>已归档</small>' : ''}
        </button>`).join('') : '<div class="agent-history-empty">还没有历史对话</div>';
      document.getElementById('agent-context-note').textContent = `正在分析：${data.subject?.name || me.name} · 健康数据实时读取`;

    async function loadMemories() {
      if (!subjectId) return;
      const data = await API.get(`/api/agent/memories?subject_user_id=${subjectId}`);
      const host = document.getElementById('agent-memory-list');
      host.innerHTML = data.items?.length ? data.items.map(memory => `<article class="agent-memory-item status-${memory.status}"><div><span>${memory.status==='candidate'?'待你确认':'已经记住'}</span><strong>${escapeHTML(memory.content)}</strong><small>${escapeHTML(memory.category)}</small></div><div>${memory.status==='candidate'?`<button data-memory-action="confirm" data-id="${memory.id}">记住</button><button data-memory-action="reject" data-id="${memory.id}">不保存</button>`:`<button data-memory-action="delete" data-id="${memory.id}">删除</button>`}</div></article>`).join('') : '<div class="empty">还没有确认过的长期记忆。</div>';
    }

    function metricValue(row) {
      if (!row) return '—';
      return `${row.value}${row.value2 != null ? '/' + row.value2 : ''}${row.unit ? ' ' + row.unit : ''}`;
    }

    function setInboxExpanded(expanded, remember = false) {
      const box = document.getElementById('agent-inbox');
      const toggle = document.getElementById('agent-inbox-toggle');
      box.classList.toggle('is-collapsed', !expanded);
      toggle.setAttribute('aria-expanded', String(expanded));
      if (remember) box.dataset.userExpanded = expanded ? '1' : '0';
    }

    function toggleInboxPanel(event) {
      event.stopPropagation();
      const box = document.getElementById('agent-inbox');
      setInboxExpanded(box.classList.contains('is-collapsed'), true);
    }

    function conditionLabel(value) {
      return ({ morning_rest: '早晨静坐后', evening_rest: '晚间静坐后', fasting: '空腹', postprandial_2h: '餐后2小时', random: '随机', resting: '静息', active: '活动后', morning_fasting: '晨起空腹', unknown: '测量条件未填写' }[value] || value || '测量条件未填写');
    }

    function renderFollowupComparison(item) {
      const c = item.comparison;
      if (!c) return '';
      return `<div class="followup-comparison"><strong>复测对比</strong><div><span>上次 ${escapeHTML(metricValue(c.baseline))}</span><b>→</b><span>本次 ${escapeHTML(metricValue(c.result))}</span></div><p>${escapeHTML(c.comparison_note || '')}</p><p>${escapeHTML(c.action || '')}</p></div>`;
    }

    async function loadInbox() {
      if (!subjectId) return;
      const box = document.getElementById('agent-inbox'), host = document.getElementById('agent-inbox-list');
      try {
        const data = await API.get(`/api/agent/inbox?subject_user_id=${subjectId}`);
        const active = [...(data.pending_result_confirmation || []), ...(data.overdue || []), ...(data.due || []), ...(data.scheduled || [])];
        const completed = data.recently_completed?.find(item => item.comparison);
        if (!active.length && !completed) { box.hidden = true; return; }
        box.hidden = false;
        document.getElementById('agent-inbox-count').textContent = `${active.length} 项待处理`;
        const needsImmediateAttention = (data.pending_result_confirmation || []).length > 0 || (data.overdue || []).length > 0;
        const remembered = box.dataset.userExpanded;
        setInboxExpanded(needsImmediateAttention || remembered === '1');
        const activeHtml = active.map(item => {
          const candidate = item.status === 'pending_result_confirmation' && item.candidate;
          const level = item.status === 'overdue' ? '已逾期' : item.status === 'due' ? '已到期' : candidate ? '待确认复测' : '已安排';
          return `<article class="agent-inbox-item status-${escapeHTML(item.status)}"><div class="agent-inbox-item-head"><span>${level}</span><strong>${escapeHTML(item.label || item.metric_type || '复测')}</strong><time>${escapeHTML(new Date(item.due_at).toLocaleString('zh-CN'))}</time></div>
            ${candidate ? `<div class="followup-pair"><div><small>基线记录</small><strong>${escapeHTML(metricValue(item.baseline))}</strong><p>${escapeHTML(conditionLabel(item.baseline?.measurement_condition))}</p></div><div><small>新测量</small><strong>${escapeHTML(metricValue(item.candidate))}</strong><p>${escapeHTML(conditionLabel(item.candidate?.measurement_condition))}</p></div></div>${renderFollowupComparison(item)}<div class="agent-inbox-actions"><button data-inbox-action="confirm-candidate" data-followup-id="${item.id}" data-metric-id="${item.candidate.id}">是本次复测</button><button data-inbox-action="reject-candidate" data-followup-id="${item.id}" data-metric-id="${item.candidate.id}">不是这次</button></div>` : `<p>请按相同条件完成${escapeHTML(item.label || '指标')}测量，新记录会先请您确认。</p><div class="agent-inbox-actions"><a class="btn" href="prediction.html?tab=trend&type=${encodeURIComponent(item.metric_type || '')}">去记录</a><button data-inbox-action="cancel" data-followup-id="${item.id}">取消复测</button></div>`}
          </article>`;
        }).join('');
        host.innerHTML = activeHtml + (completed ? `<article class="agent-inbox-item completed"><div class="agent-inbox-item-head"><span>最近完成</span><strong>${escapeHTML(completed.label)}</strong></div>${renderFollowupComparison(completed)}</article>` : '');
      } catch (error) { box.hidden = true; }
    }

    async function handleInboxAction(e) {
      const btn = e.target.closest('[data-inbox-action]'); if (!btn) return;
      const id = btn.dataset.followupId, metricId = Number(btn.dataset.metricId);
      try {
        if (btn.dataset.inboxAction === 'confirm-candidate') await API.post(`/api/actions/followups/${id}/candidate/confirm`, { metric_id: metricId });
        else if (btn.dataset.inboxAction === 'reject-candidate') await API.post(`/api/actions/followups/${id}/candidate/reject`, { metric_id: metricId });
        else if (btn.dataset.inboxAction === 'cancel' && window.confirm('确认取消这项复测吗？')) await API.post(`/api/actions/followups/${id}/cancel`, {});
        else return;
        await loadInbox(); toast('复测状态已更新', 'success');
      } catch (error) { toast(error.message, 'error'); }
    }

    async function handleMemoryAction(e) {
      const btn = e.target.closest('[data-memory-action]'); if (!btn) return;
      const id = btn.dataset.id, action = btn.dataset.memoryAction;
      try {
        if (action === 'delete') await API.delete(`/api/agent/memories/${id}`);
        else await API.post(`/api/agent/memories/${id}/${action}`, {});
        await loadMemories(); toast(action === 'confirm' ? '已记住，可随时删除' : '已更新记忆', 'success');
      } catch (error) { toast(error.message, 'error'); }

    function bindSend() {
      document.getElementById('btn-send').addEventListener('click', send);
      document.getElementById('agent-stop-wait').addEventListener('click', async () => {
        if (!activeChatController) return;
        const id = activeClientRequestId;
        if (id) API.post('/api/chat/cancel', { client_request_id: id }, { timeoutMs: 5000 }).catch(() => {});
        activeChatController.abort();

    async function loadChat() {
      const hist = document.getElementById('chat-history');
      try {
        const msgs = await API.get(`/api/chat/history?${agentQuery()}`);
        if (!msgs.length) {
          hist.innerHTML = renderMsg({
            role: 'assistant',
            content: '您好，我是小康，您的健康管家。想了解今天的身体状况吗？',
            plan: null,
            confidence: { type: 'common_sense' }
          });
          return;
        }
        hist.innerHTML = msgs.map(renderMsg).join('');
        scrollChat();
      } catch (err) {
        hist.innerHTML = `<div class="empty">对话读取失败：${escapeHTML(err.message)}</div>`;
      }

    function confidenceScoreClass(score) {
      if (score >= 80) return 'score-high';
      if (score >= 60) return 'score-mid';
      return 'score-low';
    }

    const metricDisplayNames = {
      systo: '高压（收缩压）', diasto: '低压（舒张压）', bp: '血压', pulse: '心率', hr: '心率',
      glucose: '血糖', weight: '体重', sleep: '睡眠', steps: '步数', spo2: '血氧', temp: '体温',
      resp: '呼吸频率', bmi: '体重指数', hba1c: '糖化血红蛋白', cholesterol: '胆固醇', uricacid: '尿酸'
    };
    const toolDisplayNames = {
      health_trend: '健康趋势', htn_risk: '高血压风险筛查', disease_risk: '疾病风险筛查',
      behavior: '睡眠与活动', device: '设备状态', health_summary: '健康摘要', alerts: '待处理预警',
      knowledge: '健康知识依据', followup_status: '复测随访'
    };
    function displayMetric(value) {
      const key = String(value || '').trim().toLowerCase();
      return metricDisplayNames[key] || String(value || '健康指标');
    }
    function inferActionMetric(action = {}, context = '') {
      if (action.metric_type) return String(action.metric_type).toLowerCase();
      const text = `${action.title || ''} ${action.description || action.desc || ''} ${context || ''}`;
      if (/血压|高压|低压/.test(text)) return 'bp';
      if (/血糖/.test(text)) return 'glucose';
      if (/心率|脉搏/.test(text)) return 'hr';
      if (/体重/.test(text)) return 'weight';
      if (/睡眠/.test(text)) return 'sleep';
      if (/血氧/.test(text)) return 'spo2';
      if (/体温/.test(text)) return 'temp';
      if (/呼吸/.test(text)) return 'resp';
      return '';
    }
    function normalizeVisiblePlan(action = {}, context = '') {
      return { ...action, metric_type: inferActionMetric(action, context) };
    }
    function isValidVisiblePlan(action = {}) {
      return action.action_type !== 'schedule_recheck' || !!inferActionMetric(action);
    }
    function renderActionMetric(action = {}) {
      if (action.action_type !== 'schedule_recheck') return '';
      const metricType = inferActionMetric(action);
      return `<span class="agent-action-metric ${metricType ? '' : 'is-missing'}">复测项目：${escapeHTML(metricType ? displayMetric(metricType) : '尚未明确')}</span>`;
    }
    function displayUnit(value) {
      const raw = String(value || '').trim();
      return ({ mmHg:'毫米汞柱', bpm:'次/分', kg:'千克', 'mmol/L':'毫摩尔/升', h:'小时' })[raw] || raw;
    }
    function visibleChinese(value) {
      return String(value ?? '')
        .replace(/\bsysto\b/gi, metricDisplayNames.systo).replace(/\bdiasto\b/gi, metricDisplayNames.diasto)
        .replace(/\bpulse\b/gi, metricDisplayNames.pulse).replace(/\bglucose\b/gi, metricDisplayNames.glucose)
        .replace(/\bweight\b/gi, metricDisplayNames.weight).replace(/\bsleep\b/gi, metricDisplayNames.sleep)
        .replace(/\bsteps\b/gi, metricDisplayNames.steps).replace(/\bspo2\b/gi, metricDisplayNames.spo2)
        .replace(/\bresp\b/gi, metricDisplayNames.resp).replace(/\btemp\b/gi, metricDisplayNames.temp)
        .replace(/\bBMI\b/g, metricDisplayNames.bmi).replace(/\bHbA1c\b/gi, metricDisplayNames.hba1c)
        .replace(/mmHg/gi, '毫米汞柱').replace(/mmol\s*\/\s*L/gi, '毫摩尔/升')
        .replace(/\bbpm\b/gi, '次/分').replace(/\bkg\b/gi, '千克');
    }
    function displayTool(item) { return item?.label || toolDisplayNames[item?.name] || '健康数据读取'; }

    function renderActions(m) {
      if (m.role !== 'assistant') return '';
      const conf = m.confidence || { type: 'common_sense' };
      const isData = conf.type === 'data' && conf.score != null;
      const msgId = m.id || ('msg-' + Math.random().toString(36).slice(2, 9));
      const contentEscaped = encodeURIComponent(visibleChinese(m.content || ''));

      let confidenceHtml = '';
      if (isData) {
        const cls = confidenceScoreClass(conf.score);
        confidenceHtml = `
          <button class="msg-action-btn confidence-btn ${cls}" data-action="confidence" data-msg-id="${msgId}"
                  data-score="${conf.score}" data-sources='${JSON.stringify(conf.sources || []).replace(/'/g, "&#39;")}'
                  data-reasoning="${escapeHTML(conf.reasoning || '')}"
                  title="查看可信度评分细则">
            <span class="score-ring">${conf.score}</span>
            可信度
          </button>`;
      } else {
        confidenceHtml = `
          <span class="common-sense-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4M12 8h.01"/>
            </svg>
            常识
          </span>`;
      }

      return `
        <div class="msg-actions" data-msg-id="${msgId}">
          <button class="msg-action-btn" data-action="copy" data-content="${contentEscaped}" title="复制">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制
          </button>
          <button class="msg-action-btn ${m.feedback?.rating==='like'?'active like':''}" data-action="like" title="赞">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
            </svg>
            赞
          </button>
          <button class="msg-action-btn ${m.feedback?.rating==='dislike'?'active':''}" data-action="dislike" title="踩">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
            </svg>
            踩
          </button>
          <span class="msg-action-sep"></span>
          <button class="msg-action-btn" data-action="tts" data-content="${contentEscaped}" title="朗读">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            朗读
          </button>
          <button class="msg-action-btn" data-action="regenerate" data-msg-id="${msgId}" title="重新生成">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            重新生成
          </button>
          ${confidenceHtml}
        </div>`;
    }

    function renderEvidenceBody(evidence) {
      if (!evidence || ((!Array.isArray(evidence.items) || !evidence.items.length) && !evidence.graph)) return '';
      const trendName = { rising: '上升', falling: '下降', stable: '基本稳定', unknown: '暂不判断' };
      const trendChart = item => {
        const series = (item.series || []).filter(point => Number.isFinite(Number(point.value))).slice(-14);
        if (series.length < 2) return '';
        const allValues = series.flatMap(point => [Number(point.value), Number(point.value2)].filter(Number.isFinite));
        const min = Math.min(...allValues), max = Math.max(...allValues), range = Math.max(1, max - min);
        const points = key => series.map((point, index) => `${(index / (series.length - 1) * 100).toFixed(1)},${(32 - ((Number(point[key]) - min) / range) * 28).toFixed(1)}`).join(' ');
        const secondary = series.some(point => Number.isFinite(Number(point.value2))) ? `<polyline class="secondary" points="${points('value2')}"/>` : '';
        const start = displayDate(series[0].recorded_at), end = displayDate(series.at(-1).recorded_at);
        return `<div class="agent-trend-chart" role="img" aria-label="${escapeHTML(item.metric)}从${escapeHTML(start)}到${escapeHTML(end)}的趋势图">
          <svg viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="34" x2="100" y2="34"/><polyline points="${points('value')}"/>${secondary}</svg>
          <span>${escapeHTML(start)}</span><strong>${escapeHTML(item.metric)}近 ${series.length} 次记录</strong><span>${escapeHTML(end)}</span></div>`;
      };
      const rows = (evidence.items || []).slice(0, 4).map(item => {
        const value = item.latest_value == null ? '—' : `${item.latest_value}${item.unit ? ' ' + displayUnit(item.unit) : ''}`;
        const date = item.measured_at ? new Date(item.measured_at).toLocaleDateString('zh-CN') : '—';
        const range = item.trend_start_date && item.trend_end_date ? `${displayDate(item.trend_start_date)}—${displayDate(item.trend_end_date)}` : date;
        return `<div class="agent-evidence-row"><div><span>${escapeHTML(displayMetric(item.metric))} · 最新 ${escapeHTML(date)}</span>
          <strong>${escapeHTML(value)} · ${escapeHTML(trendName[item.trend] || '暂不判断')}</strong></div>
          <small>趋势引用日期：${escapeHTML(range)} · ${Number(item.data_points || 0)} 条记录</small>${trendChart(item)}</div>`;
      }).join('');
      const graph = evidence.graph;
      const graphCitations = graph?.citations?.slice?.(0, 3) || [];
      const graphReasons = graph?.personalization?.why_this_user?.slice?.(0, 2) || [];
      const graphHtml = graph ? `<div style="margin-top:8px;padding-top:7px;border-top:1px dashed #ead8c7">
        <div style="font-weight:700;color:#7d5b40">知识依据 · 本地健康知识检索</div>
        ${graphCitations.map(c => { const label = typeof c === 'string' ? c : (c.label || c.citation || '知识来源'); const url = typeof c === 'object' ? c.url : ''; return `<div style="margin-top:3px;color:#6f6257">${url ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener" style="color:#8a6b51;text-decoration:underline">${escapeHTML(label)}</a>` : escapeHTML(label)}</div>`; }).join('')}
        ${graphReasons.length ? `<div style="margin-top:5px;color:#8a6b51">为什么针对您：${graphReasons.map(escapeHTML).join('；')}</div>` : ''}
      </div>` : '';
      const quality = evidence.data_quality;
      const qualityHtml = quality ? `<div class="agent-evidence-quality">数据完整度：${Math.round(Number(quality.ratio || 0) * 100)}%${Number(quality.measurement_condition_missing || 0) ? ` · ${Number(quality.measurement_condition_missing)} 条记录缺少测量条件` : ''}</div>` : '';
      return `<div class="agent-evidence-body">
        ${rows ? `<div style="font-weight:700;color:#9a6a42;margin-bottom:3px">依据 · 后端真实健康数据</div>
        <div style="color:#9c8b7a;margin-bottom:4px">近${Number(evidence.period_days || 90)}天，共 ${Number(evidence.data_points || 0)} 条记录</div>` : ''}
        ${qualityHtml}
        ${rows}
        ${evidence.missing_metrics && evidence.missing_metrics.length ? `<div style="color:#a87952;margin-top:6px">缺少：${escapeHTML(evidence.missing_metrics.map(displayMetric).join('、'))}</div>` : ''}
        ${graphHtml}
      </div>`;
    }

    function renderEvidence(evidence) {
      const body = renderEvidenceBody(evidence);
      if (!body) return '';
      return `<details class="agent-evidence"><summary>查看数据与知识依据</summary>${body}</details>`;
    }

    function renderToolTrace(m) {
      const trace = m.tool_trace || m.evidence?.tool_trace || [];
      if (!trace.length) return '';
      return `<div class="agent-tool-trace"><strong>本次读取依据</strong>${trace.map(item => `<span class="${item.status==='success'?'ok':'error'}">${escapeHTML(displayTool(item))} · ${item.status==='success'?'已完成':'暂不可用'}${item.freshness?` · ${escapeHTML(new Date(item.freshness).toLocaleDateString('zh-CN'))}`:''}</span>`).join('')}</div>`;
    }

    function renderTaskState(state) {
      if (!state?.status) return '';
      const labels = { completed: '本轮已完成', waiting_user: '等待您补充', waiting_confirmation: '等待本人确认', needs_followup: '需要继续跟踪', transferred: '已转为人工处理' };
      return `<div class="agent-task-state" style="margin:0 0 8px;color:#806b59;font-size:12px"><strong>${escapeHTML(labels[state.status] || '任务进行中')}</strong>${state.next_step ? ` · ${escapeHTML(state.next_step)}` : ''}</div>`;
    }

    function renderMemoryCandidates(m) {
      const rows = m.memory_candidates || [];
      if (!rows.length) return '';
      return rows.map(memory => `<div class="agent-memory-candidate"><div><strong>要记住这件事吗？</strong><p>${escapeHTML(memory.content)}</p></div><button data-memory-action="confirm" data-id="${memory.id}">记住</button><button data-memory-action="reject" data-id="${memory.id}">不保存</button></div>`).join('');
    }

    function renderPlanControl(p) {
      const metricType = inferActionMetric(p);
      const interventionPayload = p.intervention_payload ? encodeURIComponent(JSON.stringify(p.intervention_payload)) : '';
      const adherencePayload = p.adherence_payload ? encodeURIComponent(JSON.stringify(p.adherence_payload)) : '';
      const attrs = `data-action-type="${p.action_type || ''}" data-title="${encodeURIComponent(p.title)}" data-desc="${encodeURIComponent(p.desc || p.description || '')}" data-metric-type="${metricType}" data-baseline-metric-id="${p.baseline_metric_id || ''}" data-intervention-id="${p.intervention_id || ''}" data-intervention-payload="${interventionPayload}" data-adherence-payload="${adherencePayload}"`;
      const schedule = p.action_type === 'schedule_recheck' ? `<div class="agent-schedule-picker" aria-label="选择复测时间"><div class="agent-schedule-head"><strong>选择复测时间</strong><span>选择后再确认，不会自动保存</span></div><div class="agent-schedule-options">${(p.schedule_options || [{key:'later_today',label:'今天稍后'},{key:'tomorrow_morning',label:'明早'},{key:'custom',label:'自选时间'}]).map((item,index) => `<button type="button" data-schedule-key="${item.key}" class="${index===1?'selected':''}">${escapeHTML(item.label)}</button>`).join('')}</div><input type="datetime-local" aria-label="自选复测时间" hidden></div>` : '';
      const detail = p.action_type === 'n_of_1_intervention' && p.proposal_details ? `<div class="agent-intervention-details">
        <p><strong>做什么：</strong>${escapeHTML(p.proposal_details.what || '')}</p><p><strong>做多久：</strong>${escapeHTML(p.proposal_details.duration || '')}</p>
        <p><strong>如何记录：</strong>${escapeHTML(p.proposal_details.recording || '')}</p><p><strong>何时复测：</strong>${escapeHTML(p.proposal_details.recheck || '')}</p>
        <p><strong>观察指标：</strong>${escapeHTML(p.proposal_details.target_metric || '')}</p><p><strong>为什么：</strong>${escapeHTML(p.proposal_details.why || '')}</p>
        <p><strong>证据来源：</strong>${(p.proposal_details.evidence_sources || []).map(x => escapeHTML(x.label || x.title || '')).join('；')}</p>
        <p><strong>停止并就医：</strong>${escapeHTML(p.proposal_details.stop_and_seek_care || '')}</p></div>` : '';
      if (p.requires_confirmation || p.action_type) return `${detail}${schedule}<div class="agent-action-preview-controls"><button data-action="plan" ${attrs}>${p.action_type === 'n_of_1_intervention' ? '确认创建干预' : p.action_type === 'record_adherence' ? '确认记录' : '确认安排'}</button><button data-action="dismiss-plan">${p.action_type === 'n_of_1_intervention' ? '拒绝方案' : '暂不安排'}</button></div>`;
      return `<button class="plan-card-check" data-action="plan" ${attrs} style="color:${planColorFg(p.color)};border:0;background:transparent;cursor:pointer" title="创建今日待办">＋</button>`;
    }

    function displayDate(value) {
      const text = String(value || '');
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text.replace(/-/g, '/');
      if (!text) return '';
      const date = new Date(text);
      return Number.isNaN(date.getTime()) ? text : date.toLocaleDateString('zh-CN');
    }

    function renderCardBasis(m, providerLabel) {
      const trace = m.tool_trace || m.evidence?.tool_trace || [];
      const traceHtml = trace.length ? `<div class="agent-card-trace"><strong>读取内容</strong>${trace.map(item => `<span class="${item.status==='success'?'ok':'error'}">${escapeHTML(displayTool(item))} · ${item.status==='success'?'已完成':'暂不可用'}${item.freshness?` · ${escapeHTML(displayDate(item.freshness))}`:''}</span>`).join('')}</div>` : '';
      const conf = m.confidence || {};
      const level = Number(conf.score) >= 85 ? '较高' : Number(conf.score) >= 70 ? '中等' : '有限';
      const confidenceHtml = conf.type === 'data' ? `<div class="agent-confidence-explain"><strong>可信度 ${escapeHTML(conf.score ?? '—')} · ${level}</strong>
        <p>${escapeHTML(conf.reasoning || '根据可用数据、记录完整度和后端核验规则计算。')}</p>
        ${(conf.sources || []).length ? `<small>计算依据：${conf.sources.slice(0, 4).map(escapeHTML).join('；')}</small>` : ''}
        <small>可信度表示本次回答的证据充分程度，不表示疾病发生概率，也不能替代医生诊断。</small></div>` : `<div class="agent-confidence-explain"><strong>一般健康知识</strong><p>本次没有足够个人数据用于量化可信度。</p></div>`;
      return `<details class="agent-card-basis"><summary>查看依据与可信度</summary><div class="agent-card-basis-inner"><div class="agent-card-provider">回答来源：${escapeHTML(providerLabel)}</div>${confidenceHtml}${traceHtml}${renderEvidenceBody(m.evidence) || '<p>本次没有读取个人健康数据。</p>'}</div></details>`;
    }

    function renderHealthCard(m, providerLabel) {
      const p = m.presentation;
      const toneLabels = { stable: '状态平稳', watch: '建议留意', warning: '重点关注', urgent: '立即求助', insufficient: '资料不足' };
      const facts = (p.facts || []).slice(0, 3);
      const actionContext = `${p.status?.text || ''} ${(p.facts || []).map(fact => `${fact.label || ''} ${fact.context || ''} ${fact.trend || ''}`).join(' ')}`;
      const actions = (p.actions || []).map(action => normalizeVisiblePlan(action, actionContext)).filter(isValidVisiblePlan).slice(0, 2);
      const factHtml = facts.map(fact => `<article class="agent-fact">
        <span>${escapeHTML(visibleChinese(fact.label || '关键数据'))}</span>
        <strong>${escapeHTML(visibleChinese(fact.value ?? '—'))}<small>${fact.unit ? ` ${escapeHTML(displayUnit(fact.unit))}` : ''}</small></strong>
        ${fact.trend ? `<em>${escapeHTML(visibleChinese(fact.trend))}</em>` : ''}
        ${fact.measured_at ? `<p>记录时间：${escapeHTML(displayDate(fact.measured_at))}</p>` : ''}
        ${fact.context ? `<p>${escapeHTML(visibleChinese(fact.context))}</p>` : ''}
      </article>`).join('');
      const actionHtml = actions.map(action => {
        const normalized = { ...action, title: action.title, desc: action.description, color: p.mode === 'emergency' ? 'red' : 'orange' };
        const controls = action.action_type && action.requires_confirmation ? renderPlanControl(normalized) : '';
        return `<article class="agent-card-action"><div><strong>${escapeHTML(action.title)}</strong><p>${escapeHTML(action.description || '')}</p>${renderActionMetric(normalized)}</div>${controls}</article>`;
      }).join('');
      const urgent = p.mode === 'emergency' || p.status?.tone === 'urgent';
      return `<article class="agent-health-card tone-${escapeHTML(p.status?.tone || 'stable')}" aria-label="${urgent ? '紧急健康提醒' : '健康分析结果'}">
        <header class="agent-card-status"><span>${escapeHTML(toneLabels[p.status?.tone] || '健康提示')}</span><h3>${escapeHTML(visibleChinese(p.status?.title || '当前结论'))}</h3><p>${escapeHTML(visibleChinese(p.status?.text || m.content || ''))}</p></header>
        <section class="agent-card-section" aria-label="关键数据"><h4>关键数据</h4><div class="agent-facts">${factHtml}</div></section>
        <section class="agent-card-section" aria-label="下一步行动"><h4>${urgent ? '立即行动' : '下一步行动'}</h4><div class="agent-card-actions">${actionHtml || '<p class="agent-no-action">当前没有需要确认的复测行动。</p>'}</div></section>
        <aside class="agent-card-safety level-${escapeHTML(p.safety?.level || 'routine')}" ${urgent ? 'role="alert"' : ''}><strong>需要帮助时</strong><p>${escapeHTML(p.safety?.text || '')}</p></aside>
        ${renderCardBasis(m, providerLabel)}
      </article>`;
    }

    function renderClarificationCard(m) {
      const p = m.presentation || {};
      return `<article class="agent-clarification-card"><span>需要您确认</span><h3>${escapeHTML(p.status?.title || '请选择一项')}</h3><p>${escapeHTML(p.status?.text || m.content || '')}</p><div>${(p.choices || []).map(choice => `<button data-clarification-value="${encodeURIComponent(choice.value || choice.label)}">${escapeHTML(choice.label)}</button>`).join('')}</div><small>${escapeHTML(p.safety?.text || '')}</small></article>`;
    }

    function renderMsg(m) {
      const llmMeta = m.llm || {};
      const providerLabel = llmMeta.call_status === 'success'
        ? '健康智能分析'
        : (llmMeta.call_status === 'fallback' ? '本地健康工具结果' : (m.source === 'mock' ? '本地演示结果' : m.source === 'tool' ? '健康工具结果' : '本地健康知识结果'));
      const sourceHtml = m.role === 'assistant' ? `<div class="agent-source-label">回答来源：${escapeHTML(providerLabel)}</div>` : '';
      const hasHealthCard = m.presentation?.mode === 'health_card' || m.presentation?.mode === 'emergency';
      const hasClarification = m.presentation?.mode === 'clarification';
      const visiblePlans = (m.plan || []).map(p => normalizeVisiblePlan(p, m.content || '')).filter(isValidVisiblePlan).slice(0, 1);
      const planHtml = visiblePlans.length ? `
        <div class="msg-plan"><div style="font-size:14px;color:#806B59;margin:4px 0 7px;font-weight:700">今天可以做</div>${visiblePlans.map(p => `
          <div class="plan-card-mini" style="background:${planColorBg(p.color)}">
            <div class="plan-card-icon" style="background:${planColorFg(p.color)};color:#fff">${escapeHTML(p.icon)}</div>
            <div class="plan-card-text">
              <div class="plan-card-t" style="color:${planColorFg(p.color)}">${escapeHTML(p.title || '健康行动')}</div>
              <div class="plan-card-d" style="color:${planColorDesc(p.color)}">${escapeHTML(p.desc || p.description || '')}</div>
              ${renderActionMetric({ ...p, metric_type: inferActionMetric(p) })}
            </div>
            ${renderPlanControl({ ...p, metric_type: inferActionMetric(p) })}
          </div>
        `).join('')}</div>` : '';
      if (m.role === 'assistant') {
        return `
          <div class="msg msg-ai">
            <div class="msg-avatar">康</div>
            <div>
              ${renderTaskState(m.task_state)}
              ${hasHealthCard ? renderHealthCard(m, providerLabel) : hasClarification ? renderClarificationCard(m) : `<div class="msg-bubble">${escapeHTML(visibleChinese(m.content)).replace(/\n/g, '<br/>')}</div>${sourceHtml}${planHtml}${renderToolTrace(m)}${renderEvidence(m.evidence)}`}
              ${renderMemoryCandidates(m)}
              ${renderActions(m)}
            </div>
          </div>`;
      }
      return `
        <div class="msg msg-user"><div class="msg-bubble msg-bubble-user">${escapeHTML(m.content)}</div></div>
      `;
    }

    async function send() {
      if (activeChatController) return;
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      lastUserMessage = text;
      appendUserMsg(text);
      const typingEl = appendTyping();
      const btn = document.getElementById('btn-send');
      const progress = document.getElementById('agent-run-progress');
      const stage = document.getElementById('agent-run-stage');
      const stages = ['正在读取健康记录…', '正在分析趋势和风险…', '正在核对数据与知识依据…'];
      let stageIndex = 0;
      activeChatController = new AbortController();
      activeClientRequestId = requestId();
      btn.disabled = true;
      input.disabled = true;
      progress.hidden = false;
      stage.textContent = stages[0];
      chatProgressTimer = setInterval(() => {
        stageIndex = Math.min(stageIndex + 1, stages.length - 1);
        stage.textContent = stages[stageIndex];
      }, 1400);
      try {
        let streamedText = '';
        const r = await API.stream('/api/chat/stream', { message: text, subject_user_id: subjectId, conversation_id: conversationId, client_request_id: activeClientRequestId }, {
          signal: activeChatController.signal, timeoutMs: 65_000,
          onEvent(event, payload) {
            if (event === 'progress' && payload.text) stage.textContent = payload.text;
            if (event === 'delta') {
              streamedText += payload.content || '';
              const bubble = typingEl.querySelector('.msg-bubble');
              if (bubble) bubble.textContent = streamedText;
            }
          },
        });
        conversationId = r.conversation_id || conversationId;
        typingEl.remove();
        document.getElementById('chat-history').insertAdjacentHTML('beforeend',
          renderMsg({
            role: 'assistant',
            content: r.content,
            plan: r.plan,
            confidence: r.confidence || { type: 'common_sense' },
            evidence: r.evidence,
            source: r.source,
            llm: r.llm,
            presentation: r.presentation,
            tool_trace: r.tool_trace,
            task_state: r.task_state,
            memory_candidates: r.memory_candidates,
            id: r.id
          })
        );
        scrollChat();
        if (r.plan && r.plan.length) {
          toast('小康给了你 ' + r.plan.length + ' 条建议', 'success');
        }
      } catch (err) {
        typingEl.remove();
        if (err.code === 'CLIENT_CANCELLED' || err.code === 'AGENT_CANCELLED') appendAssistantMsg('本次分析已在服务器停止，没有保存未完成的回答。', []);
        else {
          const trace = err.requestId ? `（请求编号：${err.requestId}）` : '';
          appendAssistantMsg(`${err.message || '本次回答暂时失败'}${trace}${err.retryable ? '，可以稍后重试。' : '。'}`, []);
        }
      } finally {
        clearInterval(chatProgressTimer);
        chatProgressTimer = null;
        activeChatController = null;
        activeClientRequestId = null;
        btn.disabled = false;
        input.disabled = false;
        progress.hidden = true;
        input.focus();
      }
    }

    function appendUserMsg(text) {
      document.getElementById('chat-history').insertAdjacentHTML('beforeend',
        `<div class="msg msg-user"><div class="msg-bubble msg-bubble-user">${escapeHTML(text)}</div></div>`
      );
      scrollChat();
    }
    function appendAssistantMsg(content, plan) {
      document.getElementById('chat-history').insertAdjacentHTML('beforeend',
        renderMsg({ role: 'assistant', content, plan, confidence: { type: 'common_sense' } })
      );
      scrollChat();
    }
    function appendTyping() {
      const host = document.getElementById('chat-history');
      const el = document.createElement('div');
      el.className = 'msg msg-ai';
      el.innerHTML = `<div class="msg-avatar">康</div><div class="msg-bubble"><span class="loading" style="vertical-align:middle"></span> 小康正在想…</div>`;
      host.appendChild(el);
      scrollChat();
      return el;
    }
    function scrollChat() {
      const el = document.getElementById('chat-history');
      const composer = document.querySelector('.agent-chat-composer');
      const canScrollInside = el.scrollHeight > el.clientHeight + 2 && /auto|scroll/.test(getComputedStyle(el).overflowY);
      if (canScrollInside) {
        el.scrollTop = el.scrollHeight;
        return;
      }
      composer?.scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }

    // ===== 消息操作栏事件绑定（事件委托） =====
    function bindMsgActions() {
      document.getElementById('chat-history').addEventListener('click', (e) => {
        if (e.target.closest('[data-memory-action]')) { handleMemoryAction(e); return; }
        if (e.target.closest('[data-schedule-key]')) { selectScheduleOption(e.target.closest('[data-schedule-key]')); return; }
        const reason = e.target.closest('[data-feedback-reason]');
        if (reason) { submitFeedback(reason.closest('.msg-actions'), 'dislike', reason.dataset.feedbackReason || null); return; }
        const clarify = e.target.closest('[data-clarification-value]');
        if (clarify) { document.getElementById('chat-input').value = decodeURIComponent(clarify.dataset.clarificationValue); send(); return; }
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        switch (action) {
          case 'copy':       doCopy(btn); break;
          case 'like':       doLike(btn); break;
          case 'dislike':    doDislike(btn); break;
          case 'tts':        doTTS(btn); break;
          case 'regenerate': doRegenerate(btn); break;
          case 'confidence': doConfidence(btn); break;
          case 'plan':       doPlanAction(btn); break;
          case 'dismiss-plan': btn.closest('.plan-card-mini,.agent-card-action,.plan-card')?.remove(); break;
        }
      });
    }

    function bindPlanActions() {
      document.getElementById('plan-list').addEventListener('click', (e) => {
        if (e.target.closest('[data-schedule-key]')) { selectScheduleOption(e.target.closest('[data-schedule-key]')); return; }
        const btn = e.target.closest('[data-action]');
        if (btn?.dataset.action === 'plan') doPlanAction(btn);
        if (btn?.dataset.action === 'dismiss-plan') btn.closest('.plan-card')?.remove();
      });
    }

    function selectScheduleOption(btn) {
      const picker = btn.closest('.agent-schedule-picker');
      picker.querySelectorAll('[data-schedule-key]').forEach(item => item.classList.toggle('selected', item === btn));
      const custom = picker.querySelector('input[type="datetime-local"]');
      custom.hidden = btn.dataset.scheduleKey !== 'custom';
      if (!custom.hidden) custom.focus();
    }

    function selectedDueAt(btn) {
      const scope = btn.closest('.agent-card-action,.plan-card-mini,.plan-card') || btn.parentElement;
      const picker = scope?.querySelector('.agent-schedule-picker');
      const key = picker?.querySelector('[data-schedule-key].selected')?.dataset.scheduleKey || 'tomorrow_morning';
      const due = new Date();
      if (key === 'later_today') due.setTime(due.getTime() + 2 * 3600000);
      else if (key === 'tomorrow_morning') { due.setDate(due.getDate() + 1); due.setHours(8, 0, 0, 0); }
      else {
        const value = picker?.querySelector('input[type="datetime-local"]')?.value;
        if (!value || Number.isNaN(Date.parse(value))) throw new Error('请选择复测日期和时间');
        due.setTime(new Date(value).getTime());
      }
      if (due.getTime() <= Date.now()) throw new Error('复测时间必须晚于现在');
      return { key, due_at: due.toISOString() };
    }

    async function doPlanAction(btn) {
      const title = decodeURIComponent(btn.dataset.title || '完成健康计划');
      const desc = decodeURIComponent(btn.dataset.desc || '');
      const sensitive = /用药|药物|就医|医生|家属|通知/.test(title + desc);
      const actionType = btn.dataset.actionType || (/复测|复查|测量|监测/.test(title) ? 'schedule_recheck' : /通知家属/.test(title) ? 'notify_caregiver' : /联系医生|就医/.test(title) ? 'contact_doctor' : 'create_todo');
      try {
        if (actionType === 'n_of_1_intervention') {
          const payload = JSON.parse(decodeURIComponent(btn.dataset.interventionPayload || ''));
          if (!window.confirm(`请再次核对卡片内容。确认创建并激活“${title}”吗？这不是药物调整，也不能替代就医。`)) return;
          const created = await API.post('/api/actions/interventions', { ...payload, subject_user_id: subjectId });
          if (!created.intervention?.intervention_id) throw new Error('没有生成待确认干预');
          if (!created.confirmation?.one_time_token) throw new Error('干预确认卡已失效，请重新生成');
          await API.post(`/api/actions/interventions/${created.intervention.intervention_id}/confirm`, { confirmation_token: created.confirmation.one_time_token });
          btn.textContent = '已确认'; btn.disabled = true; toast('干预已由本人确认并激活', 'success'); await loadInbox(); return;
        }
        if (actionType === 'record_adherence') {
          const payload = JSON.parse(decodeURIComponent(btn.dataset.adherencePayload || ''));
          if (!window.confirm(`确认写入“${title}”吗？`)) return;
          await API.post(`/api/actions/interventions/${btn.dataset.interventionId}/executions`, payload);
          btn.textContent = '已记录'; btn.disabled = true; toast('执行情况已记录', 'success'); await loadInbox(); return;
        }
        const schedule = actionType === 'schedule_recheck' ? selectedDueAt(btn) : {};
        const metricType = btn.dataset.metricType || (/血压/.test(title + desc) ? 'bp' : /血糖/.test(title + desc) ? 'glucose' : /心率|脉搏/.test(title + desc) ? 'hr' : /体重/.test(title + desc) ? 'weight' : /睡眠/.test(title + desc) ? 'sleep' : null);
        if (actionType === 'schedule_recheck' && !metricType) throw new Error('请先明确要复测的健康指标');
        const r = await API.post('/api/actions', { action_type: actionType, title, desc, kind: sensitive ? 'sensitive' : 'agent', subject_user_id: subjectId,
          metric_type: metricType, baseline_metric_id: btn.dataset.baselineMetricId ? Number(btn.dataset.baselineMetricId) : null, ...schedule, idempotency_key: requestId() });
        if (!r.requires_confirmation || !r.request?.id) throw new Error('服务端没有返回待确认行动');
        if (!window.confirm(`待确认预览已生成。确认写入“${title}”吗？系统只会创建站内记录，不会自动打电话或发短信。`)) {
          await API.post(`/api/actions/${r.request.id}/cancel`, {});
          toast('已取消，没有创建待办或通知', 'success');
          return;
        }
        if (!r.confirmation?.one_time_token) throw new Error('确认卡已失效，请重新生成');
        await API.post(`/api/actions/${r.request.id}/confirm`, { confirmation_token: r.confirmation.one_time_token });
        btn.textContent = '✓';
        btn.disabled = true;
        toast('已确认并记录行动', 'success');
        await loadInbox();
      } catch (err) { toast(err.message, 'error'); }
    }

    function doCopy(btn) {
      const text = decodeURIComponent(btn.dataset.content || '');
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复制`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast('已复制', 'success'); } catch {}
        document.body.removeChild(ta);
      });
    }

    async function submitFeedback(parent, rating, reason = null) {
      const id = Number(parent?.dataset.msgId);
      if (!id) { toast('这条旧消息暂不支持反馈', 'error'); return; }
      await API.put(`/api/agent/messages/${id}/feedback`, { rating, reason });
      parent.querySelector('[data-action="like"]')?.classList.toggle('active', rating === 'like');
      parent.querySelector('[data-action="like"]')?.classList.toggle('like', rating === 'like');
      parent.querySelector('[data-action="dislike"]')?.classList.toggle('active', rating === 'dislike');
      parent.querySelector('.agent-feedback-reasons')?.remove();
      toast('感谢反馈，已记录', 'success');
    }

    async function doLike(btn) {
      const parent = btn.closest('.msg-actions');
      const isOn = btn.classList.contains('active');
      try {
        if (isOn) { await API.delete(`/api/agent/messages/${parent.dataset.msgId}/feedback`); btn.classList.remove('active','like'); toast('已取消反馈', 'success'); }
        else await submitFeedback(parent, 'like');
      } catch (error) { toast(error.message, 'error'); }
    }

    function doDislike(btn) {
      const parent = btn.closest('.msg-actions');
      const isOn = btn.classList.contains('active');
      if (isOn) {
        API.delete(`/api/agent/messages/${parent.dataset.msgId}/feedback`).then(() => { btn.classList.remove('active'); toast('已取消反馈', 'success'); }).catch(error => toast(error.message, 'error'));
        return;
      }
      parent.querySelector('.agent-feedback-reasons')?.remove();
      parent.insertAdjacentHTML('beforeend', `<div class="agent-feedback-reasons"><strong>哪里需要改进？</strong>${['没看懂','数据不对','建议没用','没有回答问题'].map(reason => `<button data-feedback-reason="${reason}">${reason}</button>`).join('')}<button data-feedback-reason="">跳过原因</button></div>`);
    }

    function doTTS(btn) {
      // 如果正在朗读，停止
      if (ttsUtterance) {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.msg-action-btn.reading').forEach(b => {
          b.classList.remove('reading');
          const origText = b.querySelector('svg + *') || b.lastChild;
          if (origText) origText.textContent = ' 朗读';
        });
        ttsUtterance = null;
        if (btn.classList.contains('reading')) return;
      }

      const text = decodeURIComponent(btn.dataset.content || '');
      if (!text || !window.speechSynthesis) {
        toast('浏览器不支持语音朗读', 'error');
        return;
      }

      ttsUtterance = new SpeechSynthesisUtterance(text);
      ttsUtterance.lang = 'zh-CN';
      ttsUtterance.rate = 0.9;
      ttsUtterance.pitch = 1.0;

      btn.classList.add('reading');
      const label = btn.lastChild;
      if (label) label.textContent = ' 朗读中';

      ttsUtterance.onend = () => {
        btn.classList.remove('reading');
        if (label) label.textContent = ' 朗读';
        ttsUtterance = null;
      };
      ttsUtterance.onerror = () => {
        btn.classList.remove('reading');
        if (label) label.textContent = ' 朗读';
        ttsUtterance = null;
      };

      window.speechSynthesis.speak(ttsUtterance);
    }

    async function doRegenerate(btn) {
      const messageId = Number(btn.dataset.msgId);
      if (!messageId) { toast('这条旧消息暂不支持重新生成', 'error'); return; }
      // 找到当前消息的 .msg-ai 容器并替换内容
      const msgEl = btn.closest('.msg-ai');
      if (!msgEl) return;

      // 替换为加载状态
      const contentDiv = msgEl.querySelector('.msg-bubble') || msgEl.querySelector('.agent-card-status p');
      if (!contentDiv) { toast('这条消息暂不支持重新生成', 'error'); return; }
      const oldContent = contentDiv.innerHTML;
      contentDiv.innerHTML = `<span class="loading" style="vertical-align:middle"></span> 小康正在重新想…`;

      try {
        const r = await API.post(`/api/chat/messages/${messageId}/regenerate`, { client_request_id: requestId() });
        // 重新渲染整条消息
        const newHtml = renderMsg({
          role: 'assistant',
          content: r.content,
          plan: r.plan,
          confidence: r.confidence || { type: 'common_sense' },
          evidence: r.evidence,
          presentation: r.presentation,
          source: r.source,
          llm: r.llm,
          tool_trace: r.tool_trace,
          task_state: r.task_state,
          context_manifest: r.context_manifest,
          memory_candidates: r.memory_candidates,
          id: r.id
        });
        msgEl.outerHTML = newHtml;
        scrollChat();
        toast('已重新生成', 'success');
      } catch (err) {
        contentDiv.innerHTML = oldContent;
        toast('重新生成失败', 'error');
      }
    }

    function doConfidence(btn) {
      const score = parseInt(btn.dataset.score, 10) || 0;
      const sources = JSON.parse(btn.dataset.sources || '[]');
      const reasoning = btn.dataset.reasoning || '';
      const params = new URLSearchParams({ score, sources: JSON.stringify(sources), reasoning });
      window.open(`confidence.html?${params.toString()}`, '_blank');
    }

    async function loadPlan() {
      try {
        const messages = await API.get(`/api/chat/history?${agentQuery()}`);
        let plan = [];
        for (const message of [...messages].reverse()) {
          if (message.role !== 'assistant' || !message.plan?.length) continue;
          const usable = message.plan.map(item => normalizeVisiblePlan(item, message.content || '')).filter(isValidVisiblePlan);
          if (usable.length) { plan = usable; break; }
        }
        document.getElementById('plan-count').textContent = `${plan.length} 项`;
        document.getElementById('plan-today').textContent = new Date().toISOString().slice(0, 10);
        document.getElementById('plan-list').innerHTML = plan.map(p => `
          <div class="plan-card" style="background:${planColorBg(p.color)}">
            <div class="plan-card-icon" style="background:${planColorFg(p.color)};color:#fff">${escapeHTML(p.icon)}</div>
            <div class="plan-card-text">
              <div class="plan-card-t" style="color:${planColorFg(p.color)}">${escapeHTML(p.title)}</div>
              <div class="plan-card-d" style="color:${planColorDesc(p.color)}">${escapeHTML(p.desc || '')}</div>
              ${renderActionMetric({ ...p, metric_type: inferActionMetric(p) })}
            </div>
              ${renderPlanControl({ ...p, metric_type: inferActionMetric(p) })}
          </div>
        `).join('') || '<div class="empty">暂无方案，先在左边和小康聊聊</div>';
      } catch (err) {
        document.getElementById('plan-list').innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    async function loadDailyTip() {
      if (!subjectId) return;
      const host = document.getElementById('daily-tip-content');
      const badge = document.getElementById('daily-tip-status');
      try {
        const data = await API.get(`/api/agent/daily-tip?subject_user_id=${subjectId}`);
        if (!data.tip) {
          badge.textContent = '暂无内容';
          badge.className = 'empty';
          host.innerHTML = '<p>今天暂无可展示的健康贴士。</p>';
          return;
        }
        const tip = data.tip;
        badge.textContent = tip.status_label;
        badge.className = tip.display_status === 'approved' ? 'approved' : 'preview';
        host.innerHTML = `<h3>${escapeHTML(tip.title)}</h3><p>${escapeHTML(tip.text)}</p>
          ${tip.why_for_you ? `<p class="agent-tip-why">为什么适合您：${escapeHTML(tip.why_for_you)}</p>` : ''}
          <small>${escapeHTML(tip.safety_text)}</small>
          <a href="${escapeHTML(tip.source_url)}">查看来源：${escapeHTML(tip.source_label)}</a>`;
      } catch (error) {
        badge.textContent = '暂不可用';
        badge.className = 'empty';
        host.innerHTML = '<p>贴士暂时无法读取，请稍后再试。</p>';
      }
    }

    function renderQuickPrompts() {
      const host = document.getElementById('quick-prompts');
      host.innerHTML = PROMPTS.map(p => `<button class="prompt" data-prompt>${escapeHTML(p)}</button>`).join('');
      bindPrompts(host);
    }

    function planColorFg(c) {
      return { orange:'#F4A261', green:'#7FB069', purple:'#9C7BC9', red:'#E0784E', gray:'#9C8B7A' }[c] || '#F4A261';
    }
    function planColorBg(c) {
      return { orange:'#FFE9D9', green:'#E5F0DC', purple:'#F1E8F5', red:'#FBE4DD', gray:'#FAF6EF' }[c] || '#FFE9D9';
    }
    function planColorDesc(c) {
      return { orange:'#A45F3D', green:'#5A8045', purple:'#8A6DAE', red:'#8A4538', gray:'#6B5A4A' }[c] || '#A45F3D';
    }
    function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]); }
  </script>
</template>

Auth.init().then(init);async function init(){me=await API.get('/api/auth/me');subjectId=me.id;bind();await subjects();await Promise.all([discovery(),metricList(),intake()])}

async function intake(){schema=await API.get('/api/prediction/intake/schema');try{const x=await API.get('/api/prediction/intake/latest'+sq());answers={...(x.answers||{})}}catch{answers={}}index=0;question()}
function question(){const qs=schema?.questions||[],sections=(schema?.sections||[]).filter(s=>qs.some(q=>q.section===s.id)),q=qs[index];if(!q)return;const sec=sections.find(s=>s.id===q.section),secIndex=Math.max(0,sections.findIndex(s=>s.id===q.section)),sectionQs=qs.filter(x=>x.section===q.section),sectionPosition=Math.max(0,sectionQs.findIndex(x=>x.id===q.id));$('intake-progress-text').textContent=`模块 ${secIndex+1} / ${sections.length} · ${sectionPosition+1} / ${sectionQs.length}`;$('intake-module-title').textContent=sec?.title||'健康档案';$('intake-overall-progress').textContent=`总进度 ${index+1} / ${qs.length}`;$('intake-progress').style.width=((sectionPosition+1)/Math.max(1,sectionQs.length)*100)+'%';$('intake-module-nav').innerHTML=sections.map((s,i)=>{const count=qs.filter(x=>x.section===s.id).length;return `<button type="button" data-intake-section="${esc(s.id)}" class="${i===secIndex?'active':i<secIndex?'completed':''}" aria-current="${i===secIndex?'step':'false'}"><span>${i<secIndex?'✓':i+1}</span><strong>${esc(s.title)}</strong><small>${count}题</small></button>`}).join('');document.querySelectorAll('[data-intake-section]').forEach(button=>button.onclick=()=>{const next=qs.findIndex(x=>x.section===button.dataset.intakeSection);if(next>=0){const current=qs[index];if(current?.type==='number'&&$('number-answer')?.value!=='')answers[current.id]=+$('number-answer').value;index=next;question()}});$('intake-prev').disabled=!index;const atEnd=index===qs.length-1,isSectionEnd=sectionPosition===sectionQs.length-1;$('intake-next').textContent=atEnd?'完成并查看发现':isSectionEnd?'进入下一模块':'下一题';let ctl=q.type==='choice'?`<div class="answer-options">${q.options.map(o=>`<button type="button" class="${String(answers[q.id])===String(o.value)?'selected':''}" data-answer="${esc(o.value)}">${esc(o.label)}</button>`).join('')}</div>`:`<label class="number-answer"><input type="number" id="number-answer" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${esc(answers[q.id]??'')}"><span>${esc(q.unit||'')}</span></label>`;$('intake-host').innerHTML=`<div class="intake-section-label">${esc(sec?.title)} · 第 ${sectionPosition+1} 题</div><h3>${esc(q.prompt)}</h3><p>${esc(sec?.description)}</p>${ctl}`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[q.id]=b.dataset.answer;question()})}

<template data-view="metric" data-layout="desktop">
<title>指标趋势 · 长寿康 Pro</title>
  <!-- shared-styles -->
<style>@media(min-width:901px){.metric-page>#content>.profile-form-card,.metric-page>#content>.profile-form-card:nth-of-type(n+1){display:block!important;grid-column:1!important}.metric-page>#content{display:block!important}.metric-page>#content>.page-head,.metric-page>#content>.metric-stats,.metric-page>#content>.metric-chart{display:block!important}}</style>
<!-- view-content -->
<div id="app-nav"></div>

  <main class="metric-page">
    <div id="loading" class="loading-page"><span class="loading"></span> 读取中…</div>

    <div id="content" hidden>
      <header class="page-head">
        <a href="monitoring.html" class="btn btn-ghost" style="margin-bottom:8px;padding:6px 0">← 返回监测</a>
        <h1 id="metric-title">—</h1>
        <p class="subtitle" id="metric-subtitle">—</p>
      </header>

      <div class="metric-stats" id="stats"></div>

      <section class="metric-chart">
        <h3>趋势图</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px" id="range-bar">
          <button class="chip" data-days="7">7 天</button>
          <button class="chip active" data-days="30">30 天</button>
          <button class="chip" data-days="90">90 天</button>
          <button class="chip" data-days="365">一年</button>
        </div>
        <svg id="chart" width="100%" height="240" viewBox="0 0 1100 240" preserveAspectRatio="none"></svg>
        <div class="metric-comment" id="comment">—</div>
      </section>

      <section class="profile-form-card">
        <h3 style="font-size:18px;color:var(--c-text);font-family:var(--font-cn);margin:0 0 16px;font-weight:700">录入新数据</h3>
        <form class="form" id="form-record">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
            <div class="form-row">
              <label id="label-value">数值</label>
              <input class="input" id="value" required />
              <span class="hint-text" id="hint-value">单位</span>
            </div>
            <div class="form-row" id="row-value2" hidden>
              <label id="label-value2">数值 2</label>
              <input class="input" id="value2" />
              <span class="hint-text" id="hint-value2">单位</span>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="align-self:flex-start">录入</button>
        </form>
      </section>
    </div>
  </main>

  <!-- shared-scripts -->
<script>
    Auth.init().then(() => main());

    const params = new URLSearchParams(location.search);
    let type = params.get('type') || 'bp';
    let days = parseInt(params.get('days') || '30', 10);
    let META = null;

    async function main() {
      try {
        const types = await API.get('/api/trend/types');
        META = Object.fromEntries(types.map(t => [t.type, t]));
        if (!META[type]) {
          document.getElementById('loading').innerHTML = '未知指标类型';
          return;
        }
        document.title = `${META[type].name}趋势 · 小康·健康管家`;
        configureForm();
        bindRange();
        await loadTrend();
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
      } catch (err) {
        document.getElementById('loading').innerHTML = `加载失败：${err.message}`;
      }
    }

    function configureForm() {
      const m = META[type];
      document.getElementById('label-value').textContent = type === 'bp' ? '收缩压' : '数值';
      document.getElementById('hint-value').textContent = type === 'bp' ? '高压（mmHg）' : m.unit;
      if (type === 'bp') {
        document.getElementById('row-value2').hidden = false;
        document.getElementById('label-value2').textContent = '舒张压';
        document.getElementById('hint-value2').textContent = '低压（mmHg）';
      } else {
        document.getElementById('row-value2').hidden = true;
      }
      document.getElementById('form-record').addEventListener('submit', submitRecord);
    }

    function bindRange() {
      const bar = document.getElementById('range-bar');
      bar.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        bar.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
        days = parseInt(b.dataset.days, 10);
        loadTrend();
      });
    }

    let currentData = null;
    async function loadTrend() {
      document.getElementById('metric-title').textContent = META[type].name + '趋势';
      document.getElementById('metric-subtitle').textContent = `查看您最近 ${days} 天的${META[type].name}记录`;
      document.getElementById('comment').textContent = '分析中...';
      try {
        currentData = await API.get(`/api/trend/${type}?days=${days}`);
        renderStats(currentData);
        renderChart(currentData);
        document.getElementById('comment').textContent = currentData.comment || '暂无评论';
      } catch (err) {
        document.getElementById('comment').textContent = '加载失败：' + err.message;
      }
    }

    function renderStats(d) {
      const m = META[type];
      const stats = d.stats;
      const html = [];
      html.push(statCard('最新', d.latest ? formatValue(type, d.latest) + ' ' + m.unit : '—'));
      html.push(statCard('平均', stats ? stats.avg + ' ' + m.unit : '—'));
      if (stats) {
        html.push(statCard('范围', `${stats.min} - ${stats.max}`));
        html.push(statCard('次数', stats.count + ' 次'));
      } else {
        html.push(statCard('范围', '—'));
        html.push(statCard('次数', '—'));
      }
      document.getElementById('stats').innerHTML = html.join('');
    }

    function statCard(label, value) {
      return `<div class="metric-stat"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function formatValue(t, point) {
      if (t === 'bp') return `${point.value}/${point.value2}`;
      return point.value;
    }

    function renderChart(d) {
      const svg = document.getElementById('chart');
      const pts = d.points;
      svg.innerHTML = '';
      if (pts.length === 0) {
        svg.dataset.summary = `${META[type].name}趋势：当前没有记录，无法判断上升、下降或稳定。`;
        svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" font-family="sans-serif" fill="#9C8B7A" font-size="16">还没有数据，先在下面录入一条吧</text>';
        return;
      }
      const W = 1100, H = 240, padX = 40, padY = 30;
      const xs = pts.map((_, i) => i);
      let ys = pts.map(p => p.value);
      if (type === 'bp') ys = ys.concat(pts.map(p => p.value2));
      const yMin = Math.min(...ys);
      const yMax = Math.max(...ys);
      const yRange = Math.max(1, yMax - yMin);
      const yPad = yRange * 0.15;
      const lo = yMin - yPad;
      const hi = yMax + yPad;

      const xToPx = (i) => padX + (xs.length === 1 ? (W - 2 * padX) / 2 : (i / (xs.length - 1)) * (W - 2 * padX));
      const yToPx = (v) => H - padY - ((v - lo) / (hi - lo)) * (H - 2 * padY);

      let polyline = '';
      const color = META[type].color || '#F4A261';
      const first = pts[0];
      const latest = pts.at(-1);
      const primaryChange = Number(latest.value) - Number(first.value);
      const primaryDirection = primaryChange > 0 ? '上升' : primaryChange < 0 ? '下降' : '持平';
      const primaryRange = `${Math.min(...pts.map(p => Number(p.value)))}至${Math.max(...pts.map(p => Number(p.value)))}`;
      const secondarySummary = type === 'bp'
        ? `；舒张压从${first.value2}变为${latest.value2} ${META[type].unit}`
        : '';
      svg.dataset.summary = `${META[type].name}趋势：共${pts.length}条记录，从${fmtDate(first.recorded_at)}的${formatValue(type, first)}变为${fmtDate(latest.recorded_at)}的${formatValue(type, latest)} ${META[type].unit}；主要数值总体${primaryDirection}${Math.abs(primaryChange).toFixed(1)}，范围${primaryRange} ${META[type].unit}${secondarySummary}。此摘要只描述记录变化，不代表诊断。`;
      pts.forEach((p, i) => {
        polyline += `${xToPx(i)},${yToPx(p.value)} `;
      });
      const dots = pts.map((p, i) =>
        `<circle cx="${xToPx(i)}" cy="${yToPx(p.value)}" r="3.5" fill="${color}" stroke="white" stroke-width="1.5"/>`
      ).join('');
      svg.innerHTML = `
        <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="#E8DCC9" stroke-width="1"/>
        <line x1="${padX}" y1="${padY}" x2="${padX}" y2="${H - padY}" stroke="#E8DCC9" stroke-width="1"/>
        <polyline points="${polyline.trim()}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
        <text x="${padX}" y="${padY - 8}" fill="#9C8B7A" font-size="13" font-family="sans-serif">${hi.toFixed(1)}</text>
        <text x="${padX}" y="${H - padY + 18}" fill="#9C8B7A" font-size="13" font-family="sans-serif">${lo.toFixed(1)}</text>
        <text x="${W - padX}" y="${H - 6}" fill="#9C8B7A" font-size="12" text-anchor="end" font-family="sans-serif">${fmtDate(d.points[0].recorded_at)} → ${fmtDate(d.points.at(-1).recorded_at)}</text>
      `;
    }

    async function submitRecord(e) {
      e.preventDefault();
      const valueRaw = document.getElementById('value').value.trim();
      const value2Raw = type === 'bp' ? document.getElementById('value2').value.trim() : null;
      if (!valueRaw) return;
      const value = parseFloat(valueRaw);
      const value2 = value2Raw ? parseFloat(value2Raw) : null;
      try {
        await API.post('/api/health/metrics', {
          type,
          value,
          value2,
          unit: META[type].unit || null,
          source: 'manual',
        });
        document.getElementById('value').value = '';
        if (type === 'bp') document.getElementById('value2').value = '';
        toast('录入成功', 'success');
        loadTrend();
      } catch (err) {
        toast(err.message, 'error');
      }
    }
  </script>
</template>

<template data-view="alerts" data-layout="desktop">
<title>预警中心 · 长寿康 Pro</title>
  <!-- shared-styles -->
<!-- view-content -->
<div id="app-nav"></div>

  <main class="metric-page">
    <header class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end">
      <div>
        <h1>预警中心</h1>
        <p class="subtitle">健康异常、心率、用药漏服提醒</p>
      </div>
      <button class="btn btn-secondary" id="btn-read-all">全部已读</button>
    </header>

    <div class="loading-page" id="loading"><span class="loading"></span> 读取中…</div>

    <div id="content" hidden>
      <div class="filter-bar" id="filter-bar">
        <a class="chip active" data-status="">全部</a>
        <a class="chip" data-status="pending">未处理</a>
        <a class="chip" data-status="acknowledged">已读</a>
        <a class="chip" data-status="resolved">已解决</a>
      </div>

      <div id="alert-list" class="alert-list"></div>
    </div>
  </main>

  <!-- shared-scripts -->
<script>
    Auth.init().then(() => main());

    let activeStatus = '';

    async function main() {
      bindFilter();
      await loadList();
      document.getElementById('loading').hidden = true;
      document.getElementById('content').hidden = false;
      document.getElementById('btn-read-all').addEventListener('click', readAll);
    }

    function bindFilter() {
      const bar = document.getElementById('filter-bar');
      bar.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        e.preventDefault();
        bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        activeStatus = chip.dataset.status;
        loadList();
      });
    }

    async function loadList() {
      const list = document.getElementById('alert-list');
      list.innerHTML = '<div class="loading-page"><span class="loading"></span> 读取中…</div>';
      try {
        const qs = activeStatus ? '?status=' + activeStatus : '';
        const { items } = await API.get('/api/alerts' + qs);
        if (!items.length) {
          list.innerHTML = '<div class="empty"><div class="emoji">✨</div>当前没有预警，注意继续保持</div>';
          return;
        }
        list.innerHTML = items.map(a => `
          <div class="alert-row severity-${a.severity} status-${a.status}">
            <div class="icon" style="background:${a.severity === 'warning' ? '#E0784E' : a.severity === 'critical' ? '#A04632' : '#7FB069'}">!</div>
            <div class="body">
              <div class="title">${escapeHTML(a.title)}</div>
              <div class="message">${escapeHTML(a.message)}</div>
              <div class="meta">${fromNow(a.created_at)} · ${severityName(a.severity)} · ${statusName(a.status)}</div>
            </div>
            <div class="actions">
              ${a.status === 'pending' ? `<button class="btn btn-secondary" data-id="${a.id}" data-action="ack">我知道了</button>` : ''}
              ${a.status !== 'resolved' ? `<button class="btn btn-ghost" data-id="${a.id}" data-action="resolve">已解决</button>` : ''}
            </div>
          </div>
        `).join('');
        list.querySelectorAll('button[data-action]').forEach(b => {
          b.addEventListener('click', () => updateAlert(parseInt(b.dataset.id, 10), b.dataset.action));
        });
      } catch (err) {
        list.innerHTML = `<div class="empty">读取失败：${escapeHTML(err.message)}</div>`;
      }
    }

    async function updateAlert(id, action) {
      const status = action === 'ack' ? 'acknowledged' : 'resolved';
      try {
        await API.patch(`/api/alerts/${id}`, { status });
        toast('已更新', 'success');
        loadList();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function readAll() {
      try {
        await API.post('/api/alerts/read-all');
        toast('已全部标记为已读', 'success');
        loadList();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    function severityName(s) {
      return { critical: '严重', warning: '警告', info: '提醒' }[s] || s;
    }
    function statusName(s) {
      return { pending: '未处理', acknowledged: '已读', resolved: '已解决' }[s] || s;
    }
    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    }
  </script>
</template>

    <!-- 详情模式 -->
    <section id="view-detail" hidden>
      <a href="knowledge.html" class="btn btn-ghost" style="margin-bottom:16px;">← 返回列表</a>
      <article class="article-body" id="article-body"></article>
    </section>

    <div class="loading-page" id="loading" hidden><span class="loading"></span> 正在读取…</div>
  </main>

  <!-- shared-scripts -->
<script>
    Auth.init().then(() => main());

    let activeCat = '';

    async function main() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (id) {
        await loadDetail(parseInt(id, 10));
      } else {
        bindFilter();
        bindSearch();
        bindOnlineSearch();
        const initialQ = params.get('q') || '';
        document.getElementById('search').value = initialQ;
        await loadPopularTags();
        await loadList();
        document.getElementById('relationship-lab').hidden = false;
        document.getElementById('refresh-relations').addEventListener('click', loadRelationshipCandidates);
        await loadRelationshipCandidates();
      }
    }

    function bindFilter() {
      const bar = document.getElementById('filter-bar');
      bar.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        e.preventDefault();
        bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        activeCat = chip.dataset.cat;
        loadList();
      });
    }
    let searchTimer;
    function bindSearch() {
      const input = document.getElementById('search');
      input.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadList, 250);
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); loadList(); }
      });
      document.getElementById('search-local').addEventListener('click', loadList);
    }

    function bindOnlineSearch() {
      document.getElementById('search-online').addEventListener('click', loadOnlineResearch);
      document.getElementById('close-online-results').addEventListener('click', () => {
        document.getElementById('online-research').hidden = true;
        document.getElementById('search-online').focus();
      });
    }

    async function loadOnlineResearch() {
      const q = document.getElementById('search').value.trim();
      const section = document.getElementById('online-research');
      const list = document.getElementById('online-result-list');
      const button = document.getElementById('search-online');
      section.hidden = false;
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (!q) {
        list.innerHTML = '<div class="empty">请先输入一个健康主题，例如“老年人睡眠”或“血压复测”。</div>';
        document.getElementById('search').focus();
        return;
      }
      button.disabled = true;
      button.textContent = '正在联网查询…';
      list.innerHTML = '<div class="loading-page"><span class="loading"></span> 正在查询公开研究文献…</div>';
      try {
        const data = await API.get('/api/knowledge/online-search?q=' + encodeURIComponent(q));
        document.getElementById('online-search-summary').textContent =
          `“${q}”找到 ${data.total_available || 0} 条相关记录，本页显示前 ${data.items?.length || 0} 条。${data.cached ? '（使用十分钟内缓存）' : ''}`;
        document.getElementById('online-research-notice').textContent = data.disclaimer || '外部资料尚未经过本项目医学审核。';
        if (!data.items?.length) {
          list.innerHTML = '<div class="empty">暂未找到相关研究。可以换用更简短的主题再试。</div>';
          return;
        }
        list.innerHTML = data.items.map((item, index) => `
          <article class="online-result-card">
            <div class="online-result-number">研究资料 ${index + 1}</div>
            <h3>${escapeHTML(item.title_original)}</h3>
            <div class="online-original-label">原始研究题目（可能为英文）</div>
            <p class="online-result-meta">${escapeHTML(item.authors)} · ${escapeHTML(item.journal)} · ${escapeHTML(item.publication_year)}</p>
            ${item.abstract ? `<details><summary>查看原始摘要</summary><p>${escapeHTML(item.abstract)}</p></details>` : '<p class="online-no-abstract">该记录暂无可展示摘要。</p>'}
            <div class="online-result-footer">
              <span>${item.pmid ? `文献编号：${escapeHTML(item.pmid)}` : '文献编号暂缺'}</span>
              <a class="btn btn-ghost" href="${safeURL(item.source_url)}" target="_blank" rel="noopener noreferrer">到来源页查看</a>
            </div>
          </article>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty">${escapeHTML(err.message || '联网研究检索暂时不可用，请稍后重试。')}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = '联网查研究';
      }
    }

    async function loadList() {
      const q = document.getElementById('search').value.trim();
      const list = document.getElementById('article-list');
      list.innerHTML = '<div class="loading-page"><span class="loading"></span> 读取中…</div>';
      try {
        const qs = new URLSearchParams();
        if (activeCat) qs.set('category', activeCat);
        if (q) qs.set('q', q);
        const { items } = await API.get('/api/knowledge?' + qs);
        if (!items.length) {
          list.innerHTML = '<div class="empty"><div class="emoji">📭</div>没找到相关文章</div>';
          return;
        }
        list.innerHTML = items.map(a => `
          <a class="article-card ${a.category}" href="knowledge.html?id=${a.id}">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <span class="category-tag">${categoryName(a.category)}</span>
              <span style="font-size:13px;font-weight:700;color:${a.review_status === 'approved' ? '#356b3f' : '#8a5a22'};">${reviewName(a.review_status)}</span>
            </div>
            <div class="title">${escapeHTML(a.title)}</div>
            <div class="summary">${escapeHTML(a.summary || '')}</div>
            <div class="meta">
              ${a.view_count} 次浏览 · ${fmtDate(a.created_at)}
            </div>
          </a>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty">读取失败：${escapeHTML(err.message)}</div>`;
      }
    }

    async function loadRelationshipCandidates() {
      const host = document.getElementById('relationship-list');
      const q = document.getElementById('search').value.trim();
      host.innerHTML = '<div class="loading-page"><span class="loading"></span> 正在寻找跨主题关联…</div>';
      try {
        const qs = new URLSearchParams();
        if (q) qs.set('q', q);
        const data = await API.get('/api/knowledge/graph/relationship-candidates?' + qs);
        if (!data.items?.length) {
          host.innerHTML = '<div class="empty">当前关键词下没有新的两跳关系候选。可换一个主题再试。</div>';
          return;
        }
        host.innerHTML = data.items.slice(0, 6).map(item => {
          const labels = item.node_labels || [];
          return `<article style="padding:16px 0;border-top:1px solid #eee3d8;">
            <div style="font-size:18px;font-weight:700;line-height:1.6;">${labels.map(escapeHTML).join(' → ')}</div>
            <div style="margin-top:6px;font-size:14px;color:#8a5a22;font-weight:700;">测试版研究预览 · 间接关联</div>
            <p style="margin:8px 0 0;color:var(--c-text-muted);font-size:15px;line-height:1.7;">${escapeHTML(item.allowed_expression || '这是关联线索，尚未证明直接因果。')}</p>
          </article>`;
        }).join('') + `<p style="font-size:14px;color:var(--c-text-muted);margin:14px 0 0;">${escapeHTML(data.disclaimer || '')}</p>`;
      } catch (err) {
        host.innerHTML = `<div class="empty">关系发现失败：${escapeHTML(err.message)}</div>`;
      }
    }

    async function loadPopularTags() {
      try {
        const tags = await API.get('/api/knowledge/meta/popular-tags');
        const host = document.getElementById('popular-tags');
        host.innerHTML = tags.slice(0, 8).map(t =>
          `<a class="tag" href="knowledge.html?q=${encodeURIComponent(t.tag)}">${escapeHTML(t.tag)} · ${t.count}</a>`
        ).join('');
      } catch {}
    }

    async function loadDetail(id) {
      document.getElementById('view-list').hidden = true;
      document.getElementById('view-detail').hidden = false;
      document.getElementById('page').dataset.mode = 'detail';
      const body = document.getElementById('article-body');
      body.innerHTML = '<div class="loading-page"><span class="loading"></span> 读取中…</div>';
      try {
        const a = await API.get('/api/knowledge/' + id);
        const tags = (a.tags || []).map(t =>
          `<a class="tag" href="knowledge.html?q=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`
        ).join('');
        body.innerHTML = `
          <header>
            <span class="category-tag" style="display:inline-flex;background:#FFE9D9;color:#8C4520;font-size:13px;font-weight:700;padding:6px 14px;border-radius:14px;font-family:var(--font-cn)">${categoryName(a.category)}</span>
            <h1 style="font-size:30px;color:var(--c-text);font-family:var(--font-cn);margin:12px 0 6px;font-weight:700">${escapeHTML(a.title)}</h1>
            <div style="color:var(--c-text-muted);font-size:14px;font-family:var(--font-cn);margin-bottom:16px">${a.view_count} 次浏览</div>
          </header>
          <div style="padding:14px 16px;border-radius:14px;background:${a.review_status === 'approved' ? '#edf6ea' : '#fff5e8'};margin-bottom:18px;font-size:16px;line-height:1.7;">
            <strong>${reviewName(a.review_status)}</strong>：${a.review_status === 'approved' ? '内容已通过项目医学审核。' : '内容尚待项目医学审核，仅用于健康教育研究预览，不替代诊断或用药建议。'}
            ${a.source_url ? `<br>来源：<a href="${safeURL(a.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(a.source_label || '查看权威来源')}</a>` : ''}
          </div>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          ${markdownToHTML(a.body)}
        `;
      } catch (err) {
        body.innerHTML = `<div class="empty">文章加载失败：${escapeHTML(err.message)}</div>`;
      }
    }

    function categoryName(c) {
      return { topic: '科普', qa: '问答', tip: '贴士' }[c] || c;
    }
    function reviewName(status) { return status === 'approved' ? '已审核' : status === 'rejected' ? '已退回' : '研究预览'; }
    function safeURL(value) {
      try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? escapeHTML(url.href) : '#'; }
      catch { return '#'; }
    }

    // 简易 markdown → HTML（处理 ##、**、-、表格）
    function markdownToHTML(md) {
      const lines = md.split(/\r?\n/);
      let out = '';
      let inTable = false;
      let tableLines = [];
      function flushTable() {
        if (!tableLines.length) return;
        const rows = tableLines.filter(l => l.includes('|')).map(l => l.split('|').map(s => s.trim()).filter(Boolean));
        if (rows.length < 2) {
          out += rows.map(r => r.join(' | ')).join('<br/>') + '\n';
        } else {
          const headers = rows[0];
          out += '<table><thead><tr>' + headers.map(h => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>';
          for (let i = 2; i < rows.length; i++) {
            out += '<tr>' + rows[i].map(h => `<td>${inline(h)}</td>`).join('') + '</tr>';
          }
          out += '</tbody></table>\n';
        }
        tableLines = [];
      }
      for (const line of lines) {
        if (line.trim().startsWith('|')) {
          inTable = true;
          tableLines.push(line);
          continue;
        } else if (inTable) {
          flushTable();
          inTable = false;
        }
        if (line.startsWith('## ')) out += `<h2>${inline(line.slice(3))}</h2>`;
        else if (line.startsWith('# ')) out += `<h2>${inline(line.slice(2))}</h2>`;
        else if (line.trim().startsWith('- ')) {
          // 多行列表不适合简易处理，用 <p> 渲染
          out += `<p>· ${inline(line.replace(/^-\s*/, ''))}</p>`;
        } else if (line.trim() === '') out += '';
        else out += `<p>${inline(line)}</p>`;
      }
      if (inTable) flushTable();
      return out;
    }
    function inline(s) {
      return escapeHTML(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    }
  </script>
</template>

        currentUser = await API.get('/api/profile/me');
        renderUser();
        bindForms();
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
      } catch (err) {
        document.getElementById('loading').innerHTML = `加载失败：${err.message}`;
      }
    }

    function renderUser() {
      const u = currentUser;
      document.getElementById('avatar').textContent = (u.name || '?').slice(0, 1);
      document.getElementById('avatar').style.background = u.avatar_color || '#7FB069';
      document.getElementById('display-name').textContent = u.name || '—';
      document.getElementById('desktop-display-name').textContent = u.name || '—';
      document.getElementById('desktop-avatar').textContent = (u.name || '?').slice(0, 1);
      document.getElementById('desktop-avatar').style.background = u.avatar_color || '#ff5268';
      const parts = [];
      if (u.age) parts.push(`${u.age} 岁`);
      if (u.height) parts.push(`身高 ${u.height}m`);
      if (u.emergency_name) parts.push(`紧急联系人：${u.emergency_name}`);
      document.getElementById('display-meta').textContent = parts.join(' · ') || '点击下方完善资料';

      document.getElementById('name').value = u.name || '';
      document.getElementById('age').value = u.age || '';
      document.getElementById('height').value = u.height || '';
      document.getElementById('emergency_name').value = u.emergency_name || '';
      document.getElementById('emergency_phone').value = u.emergency_phone || '';
      for (const id of ['education_level', 'self_rated_health', 'smoking_status', 'drinking_status']) document.getElementById(id).value = u[id] ?? '';
      for (const id of ['cigarettes_per_day', 'drinking_frequency', 'exercise_level']) document.getElementById(id).value = u[id] ?? '';
      for (const id of ['chronic_hypertension', 'chronic_diabetes', 'chronic_heart', 'chronic_stroke', 'dyslipidemia', 'lung_disease']) document.getElementById(id).checked = Number(u[id]) === 1;
    }

    function bindForms() {
      // 基本信息
      document.getElementById('form-basic').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
          name: document.getElementById('name').value.trim(),
          age: document.getElementById('age').value,
          height: document.getElementById('height').value,
        };
        try {
          currentUser = await API.put('/api/profile/me', body);
          renderUser();
          toast('已保存', 'success');
        } catch (err) {
          toast(err.message, 'error');
        }
      });

      document.getElementById('form-risk-profile').addEventListener('submit', async (e) => {
        e.preventDefault();
        const valueOrNull = id => document.getElementById(id).value === '' ? null : document.getElementById(id).value;
        const body = {
          education_level: valueOrNull('education_level'), self_rated_health: valueOrNull('self_rated_health'),
          smoking_status: valueOrNull('smoking_status'), cigarettes_per_day: valueOrNull('cigarettes_per_day'),
          drinking_status: valueOrNull('drinking_status'), drinking_frequency: valueOrNull('drinking_frequency'),
          exercise_level: valueOrNull('exercise_level'),
          chronic_hypertension: document.getElementById('chronic_hypertension').checked ? 1 : 0,
          chronic_diabetes: document.getElementById('chronic_diabetes').checked ? 1 : 0,
          chronic_heart: document.getElementById('chronic_heart').checked ? 1 : 0,
          chronic_stroke: document.getElementById('chronic_stroke').checked ? 1 : 0,
          dyslipidemia: document.getElementById('dyslipidemia').checked ? 1 : 0,
          lung_disease: document.getElementById('lung_disease').checked ? 1 : 0,
        };
        try { currentUser = await API.put('/api/profile/me', body); renderUser(); toast('风险资料已保存，重新评估即可生效', 'success'); }
        catch (err) { toast(err.message, 'error'); }
      });

      // 紧急联系人
      document.getElementById('form-emergency').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
          emergency_name: document.getElementById('emergency_name').value.trim(),
          emergency_phone: document.getElementById('emergency_phone').value.trim(),
        };
        try {
          currentUser = await API.put('/api/profile/me', body);
          renderUser();
          toast('已保存', 'success');
        } catch (err) {
          toast(err.message, 'error');
        }
      });

      // 修改密码
      document.getElementById('form-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        const old_password = document.getElementById('old_password').value;
        const new_password = document.getElementById('new_password').value;
        try {
          await API.post('/api/profile/password', { old_password, new_password });
          document.getElementById('old_password').value = '';
          document.getElementById('new_password').value = '';
          toast('密码已修改', 'success');
        } catch (err) {
          toast(err.message, 'error');
        }
      });

      // 注销
      document.getElementById('btn-delete').addEventListener('click', async () => {
        if (!confirm('确定要注销账号吗？所有数据将无法恢复！')) return;
        if (!confirm('真的确定吗？这是最后确认。')) return;
        try {
          await API.delete('/api/profile/me');
          location.href = 'login.html';
        } catch (err) {
          toast(err.message, 'error');
        }
      });
    }
  </script>
</template>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

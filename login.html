<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 长寿康 Pro</title>
  <link rel="stylesheet" href="/assets/css/pro-auth.css">
</head>
<body data-auth-page="login">
  <div class="auth-layout">
    <aside class="auth-intro">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">♡</span><span>长寿康 Pro</span></a>
      <div class="intro-copy"><span class="eyebrow">CARE, CONNECTED</span><h1>让每一次关心<br>都有据可依。</h1><p>健康记录、智能提醒与家人守护，在同一处自然衔接。</p></div>
      <div class="intro-bottom">长寿康 · 陪伴每一天的健康生活</div>
    </aside>
    <main class="auth-main">
      <div class="auth-panel">
        <a class="back-link" href="/">← 返回首页</a>
        <p class="panel-label">欢迎回来</p>
        <h2>登录长寿康</h2>
        <p class="panel-subtitle">登录后继续查看您的健康信息与亲情守护。</p>
        <form id="auth-form" class="auth-form" novalidate>
          <div id="auth-error" class="error" role="alert" aria-live="polite"></div>
          <div class="field"><label class="field-label" for="identifier">账号姓名</label><input id="identifier" name="identifier" type="text" placeholder="请输入注册时的姓名" autocomplete="username" maxlength="80" required autofocus></div>
          <div class="field"><label class="field-label" for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required><button class="show-password" type="button" data-toggle-password="password" aria-label="显示密码">显示</button></div></div>
          <button id="submit-btn" class="submit-btn" type="submit">登 录</button>
        </form>
        <div class="auth-switch">还没有账号？ <a id="switch-link" href="/register.html">创建新账号 →</a></div>
        <div class="demo-hint"><strong>体验账号</strong><br>张奶奶 / 123456 · 李爷爷 / 123456</div>
        <p class="mobile-caption">长寿康 · 陪伴每一天的健康生活</p>
      </div>
    </main>
  </div>
  <script src="/assets/js/pro-core.js"></script>
  <script src="/assets/js/pro-auth.js"></script>
</body>
</html>

<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>长寿康 Pro</title>
<link href="assets/css/pro-tailwind.css" rel="stylesheet"/>
<link href="assets/css/fontawesome.min.css" rel="stylesheet"/>
<link href="assets/css/pro-charts.css" rel="stylesheet"/>
<link href="assets/css/pro-responsive.css" rel="stylesheet"/>
<link href="assets/css/pro-insight.css" rel="stylesheet"/>
<script>
  /* 真机上系统自带状态栏，隐藏模拟状态栏，只保留安全区留白 */
  if (navigator.maxTouchPoints > 0 && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
    document.documentElement.classList.add('is-mobile-device');
  }
  /* 首屏前恢复上次选择的字号，避免闪一下再变大 */
  try {
    var savedFont = localStorage.getItem('pro-font-mode');
    if (savedFont === 'standard' || savedFont === 'large' || savedFont === 'xlarge') {
      document.documentElement.dataset.font = savedFont;
    }
  } catch (e) {}
</script>
<style>
    /* 适老字体层级：由 html 的 data-font 统一缩放根字号，这里只做占位保持兼容 */
    body.font-mode-standard { font-size: 1rem; }
    body.font-mode-large { font-size: 1rem; }
    body.font-mode-xlarge { font-size: 1rem; }

    .pro-answer { font-size: 1.12rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    body.font-mode-xlarge .pro-answer { font-size: 1.2rem; }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      user-select: none;
    }

    input, textarea {
      user-select: text;
    }

    /* Apple Liquid Glassmorphism 毛玻璃质感 */
    .glass-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.03), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
    }

    .glass-card-subtle {
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-top: 1px solid rgba(255, 255, 255, 0.75);
    }

    .glass-header {
      background: rgba(245, 245, 247, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(230, 230, 235, 0.75);
    }

    .nav-tab { color: #a1a1aa; font-weight: 500; }
    .nav-tab.active { color: #18181b; font-weight: 900; }

    /* 高清晰高对比辅助模式 */
    body.high-contrast-mode {
      filter: contrast(1.15);
    }
    body.high-contrast-mode .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #27272a;
    }
    body.high-contrast-mode .text-zinc-500,
    body.high-contrast-mode .text-zinc-400 {
      color: #3f3f46 !important;
    }

    /* 底部安全区加高，防内容被底栏阻隔 */
    .phone-content-bottom {
      padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 1.5rem));
    }

    /* 页面平滑过渡 */
    .view-fade {
      animation: viewFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 语音波动光效 */
    @keyframes subtlePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.97); }
    }
    .speaking-pulse {
      animation: subtlePulse 1.4s ease-in-out infinite;
    }

    /* 平滑隐藏滚动条但保留功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="app-body text-zinc-900 font-mode-large antialiased selection:bg-zinc-200">
<!-- 应用外壳：手机端铺满整屏，平板/桌面为居中画布（无固定手机外壳） -->
<div class="app-shell">
<!-- 顶部安全区（真机隐藏模拟状态栏，只留刘海留白） -->
<div class="app-statusbar flex items-center justify-between shrink-0 z-40 bg-transparent select-none">
<span class="text-xs font-semibold text-zinc-800 tracking-tight" id="statusTime">09:41</span>
<div class="flex items-center gap-1.5 text-zinc-800 text-xs">
<i class="fa-solid fa-signal text-[11px]"></i>
<i class="fa-solid fa-wifi text-[11px]"></i>
<i class="fa-solid fa-battery-full text-xs"></i>
</div>
</div>
<!-- ============================================================== -->
<!-- 视图 0: 适老极简免密与验证码登入界面                             -->
<!-- ============================================================== -->
<section class="app-login view-fade flex-1 flex flex-col justify-between pt-4 pb-8 z-30 overflow-y-auto no-scrollbar" id="view-login"></section>
<!-- ============================================================== -->
<!-- 主应用界面 (登录成功后展示)                                    -->
<!-- ============================================================== -->
<div class="hidden flex-1 flex flex-col h-full relative overflow-hidden" id="main-app">
<!-- 统一毛玻璃顶部标题栏 -->
<header class="app-header glass-header sticky top-0 z-30 py-3.5 flex items-center justify-between">
<div>
<span class="text-[11px] font-semibold tracking-wider text-zinc-400 uppercase" id="currentDateStr">--月--日 星期-</span>
<h2 class="text-2xl font-black tracking-tight text-zinc-900" id="mainHeaderTitle">健康概览</h2>
</div>
<!-- 朗读 & 字体大小调节 & 个人中心 -->
<div class="flex items-center gap-2">
<button class="h-9 px-3.5 rounded-full glass-card flex items-center gap-1.5 text-xs font-bold text-zinc-800 shadow-glass-button active:scale-95 transition-all" id="voiceActionBtn" onclick="handleVoiceButtonClick()" title="朗读本页重点或停止" aria-pressed="false">
<i class="fa-solid fa-volume-high text-zinc-600" id="voiceIcon"></i>
<span id="voiceLabel">朗读</span>
</button>
<button class="h-9 px-3 rounded-full glass-card flex items-center gap-1 text-xs font-bold text-zinc-800 shadow-glass-button active:scale-95 transition-all" onclick="cycleFontSize()" title="切换字号大小">
<span class="text-zinc-400 font-normal" id="fontLabelText">字号</span>
<span class="bg-zinc-200/80 px-1.5 py-0.5 rounded text-[11px] font-black" id="fontBadge">大</span>
</button>
<button class="w-9 h-9 rounded-full bg-zinc-900 text-white font-bold text-xs flex items-center justify-center active:scale-95 transition-all shadow-sm" id="btnProfileEntry" onclick="switchTab('profile')" title="个人中心与适老设置">
            王
          </button>
</div>
</header>
<!-- 主视图滚动区域 -->
<main class="app-main flex-1 overflow-y-auto pt-3 phone-content-bottom space-y-4 no-scrollbar" id="mainScrollArea">
<!-- ==================== Tab 1: 今日健康概览 ==================== -->
<div class="tab-pane space-y-4 view-fade" id="tab-overview"></div>
<!-- ==================== Tab 2: 智能健康管家 ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-butler"></div>
<!-- ==================== Tab 3: 慢病风险评估 ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-risk"></div>
<!-- ==================== Tab 4: 档案与趋势 ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-trends"></div>
<!-- ==================== Tab 5: 亲情与安全守护 ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-care"></div>
<!-- ==================== Tab 6: 个人中心与适老设置 ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-profile"></div>
<!-- ==================== Tab 7: 账号安全与隐私 ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-account"></div>
<!-- ==================== 二级页: 可追溯知识证据（GraphRAG） ==================== -->
<div class="tab-pane hidden space-y-4 view-fade" id="tab-knowledge"></div>
</main>
<!-- 毛玻璃底部五键导航条 -->
<nav class="app-nav glass-nav absolute bottom-0 left-0 right-0 py-2 flex items-center justify-around z-30 select-none">
<button class="nav-tab active flex flex-col items-center justify-center w-14 py-1 active:scale-90 transition-transform" data-view="overview" aria-current="page" onclick="switchTab('overview')">
<i class="fa-solid fa-house text-lg mb-0.5"></i>
<span class="text-[11px]">概览</span>
</button>
<button class="nav-tab flex flex-col items-center justify-center w-14 py-1 active:scale-90 transition-transform hover:text-zinc-800" data-view="butler" onclick="switchTab('butler')">
<div class="relative">
<i class="fa-solid fa-wand-magic-sparkles text-lg mb-0.5"></i>
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 absolute -top-0.5 -right-1"></span>
</div>
<span class="text-[11px]">管家</span>
</button>
<button class="nav-tab flex flex-col items-center justify-center w-14 py-1 active:scale-90 transition-transform hover:text-zinc-800" data-view="risk" onclick="switchTab('risk')">
<i class="fa-solid fa-heart-pulse text-lg mb-0.5"></i>
<span class="text-[11px]">风险</span>
</button>
<button class="nav-tab flex flex-col items-center justify-center w-14 py-1 active:scale-90 transition-transform hover:text-zinc-800" data-view="trends" onclick="switchTab('trends')">
<i class="fa-solid fa-chart-line text-lg mb-0.5"></i>
<span class="text-[11px]">趋势</span>
</button>
<button class="nav-tab flex flex-col items-center justify-center w-14 py-1 active:scale-90 transition-transform hover:text-zinc-800" data-view="care" onclick="switchTab('care')">
<i class="fa-solid fa-shield-heart text-lg mb-0.5"></i>
<span class="text-[11px]">守护</span>
</button>
</nav>
</div>
<!-- ==================== 弹窗组件群 (z-50) ==================== -->
<!-- 弹窗 A: 短信大字验证码登录弹窗 -->
<!-- 弹窗 B: 录入体征数据 -->
<!-- 弹窗 C: 录入新药品 -->
<!-- 弹窗 D: 检查单详情抽屉 -->
<!-- 弹窗 E: SOS 呼救 5 秒倒计时 -->
<!-- 顶部 Toast 提示条 -->
<div class="app-toast absolute top-12 left-1/2 -translate-x-1/2 z-50 glass-card bg-zinc-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300" id="toastMessage">
<span id="toastContent">已更新</span>
</div>
</div>
<script src="assets/js/pro-core.js"></script>
<script src="assets/js/pro-charts.js"></script>
<script src="assets/js/pro-voice-summary.js"></script>
<script src="assets/js/pro-mobile.js"></script>
</body>
</html>

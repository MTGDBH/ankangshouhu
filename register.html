<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · 长寿康 Pro</title>
  <link rel="stylesheet" href="/assets/css/pro-auth.css">
</head>
<body data-auth-page="register">
  <div class="auth-layout">
    <aside class="auth-intro">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">♡</span><span>长寿康 Pro</span></a>
      <div class="intro-copy"><span class="eyebrow">A HEALTHIER CONNECTION</span><h1>从今天开始，<br>一起守护健康。</h1><p>为自己建立健康档案，也能成为家人的贴心守护者。</p></div>
      <div class="intro-bottom">长寿康 · 陪伴每一天的健康生活</div>
    </aside>
    <main class="auth-main">
      <div class="auth-panel">
        <a class="back-link" href="/login.html">← 返回登录</a>
        <p class="panel-label">开始使用</p>
        <h2>创建账号</h2>
        <p class="panel-subtitle">选择使用身份，填写信息后即可进入新版界面。</p>
        <form id="auth-form" class="auth-form" novalidate>
          <div id="auth-error" class="error" role="alert" aria-live="polite"></div>
          <div><span class="field-label" id="role-label">选择使用身份</span><div class="roles" role="radiogroup" aria-labelledby="role-label"><label class="role-option"><input name="role" type="radio" value="senior" checked><span class="role-content"><strong>我是长辈</strong><small>记录健康，查看提醒与趋势</small></span></label><label class="role-option"><input name="role" type="radio" value="caregiver"><span class="role-content"><strong>我是家人</strong><small>绑定长辈，协同关怀</small></span></label></div></div>
          <div class="field"><label class="field-label" for="name">姓名</label><input id="name" name="name" type="text" placeholder="请输入姓名" autocomplete="name" maxlength="80" required autofocus></div>
          <div class="two-fields"><div class="field"><label class="field-label" for="gender">性别 <span class="form-note">可选</span></label><select id="gender" name="gender"><option value="unknown">暂不填写</option><option value="female">女</option><option value="male">男</option></select></div><div class="field"><label class="field-label" for="age">年龄 <span class="form-note">可选</span></label><input id="age" name="age" type="number" inputmode="numeric" min="1" max="120" placeholder="1–120 岁"></div></div>
          <div class="field"><label class="field-label" for="password">设置密码</label><div class="password-field"><input id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="new-password" minlength="6" required><button class="show-password" type="button" data-toggle-password="password" aria-label="显示密码">显示</button></div></div>
          <div class="field"><label class="field-label" for="password2">确认密码</label><input id="password2" name="password2" type="password" placeholder="再次输入密码" autocomplete="new-password" required></div>
          <button id="submit-btn" class="submit-btn" type="submit">创建账号</button>
          <p class="form-note">家人账号创建后，可通过长辈提供的授权码绑定健康档案。</p>
        </form>
        <div class="auth-switch">已有账号？ <a id="switch-link" href="/login.html">立即登录 →</a></div>
        <p class="mobile-caption">长寿康 · 陪伴每一天的健康生活</p>
      </div>
    </main>
  </div>
  <script src="/assets/js/pro-core.js"></script>
  <script src="/assets/js/pro-auth.js"></script>
</body>
</html>
